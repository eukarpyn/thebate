["v148", "tabu", "V", `As rainhas da França davam à luz diante de dezenas de cortesãos, para provar que o herdeiro era legítimo.`, `No primeiro parto de Maria Antonieta, o quarto encheu tanto que ela desmaiou por falta de ar.`, `French queens gave birth in front of dozens of courtiers, to prove the heir was legitimate.`, `During Marie Antoinette's first delivery, the room got so crowded she fainted from lack of air.`],
["v149", "tabu", "V", `No século 19, era comum fotografar familiares mortos como lembrança, posados como se estivessem dormindo ou vivos.`, `A fotografia era cara, e para muitas famílias aquela era a única imagem que teriam da pessoa.`, `In the 19th century, it was common to photograph dead relatives as keepsakes, posed to look asleep or alive.`, `Photography was expensive, and for many families, that was the only picture they'd ever have of the person.`],
["v150", "tabu", "V", `A palavra "histeria" vem da palavra grega para útero.`, `Durante séculos, médicos acreditaram que era uma doença exclusiva das mulheres, causada pelo útero.`, `The word "hysteria" comes from the Greek word for uterus.`, `For centuries, doctors believed it was a disease exclusive to women, caused by the uterus.`],
["v151", "tabu", "V", `A palavra "abacate" vem de um termo asteca que também significava testículo.`, `A palavra original, ahuacatl, era usada para os dois, provavelmente por causa do formato da fruta.`, `The word "avocado" comes from an Aztec term that also meant testicle.`, `The original word, ahuacatl, was used for both, likely because of the fruit's shape.`],
["v152", "espaço", "V", `A luz do Sol que chega até você hoje foi produzida no núcleo dele há mais de 10 mil anos.`, `A energia leva milênios para atravessar o interior do Sol. Da superfície até a Terra são só 8 minutos.`, `The sunlight reaching you right now was produced in the Sun's core more than 10,000 years ago.`, `The energy takes millennia to travel through the Sun's interior. From its surface to Earth, it's just 8 minutes.`],
["v153", "espaço", "V", `A Austrália é mais larga do que a Lua.`, `A Austrália tem cerca de 4.000 km de leste a oeste. O diâmetro da Lua é de 3.474 km.`, `Australia is wider than the Moon.`, `Australia is about 4,000 km across from east to west. The Moon's diameter is 3,474 km.`],
["v154", "espaço", "V", `O maior vulcão de Marte tem mais que o dobro da altura do Everest.`, `O Monte Olimpo tem cerca de 22 km de altura e uma base do tamanho de um país.`, `The largest volcano on Mars is more than twice the height of Mount Everest.`, `Olympus Mons stands about 22 km high, with a base the size of a small country.`],

["m51", "história", "M", `Maria Antonieta disse "se não têm pão, que comam brioches".`, `Não há registro de que ela tenha dito isso. A frase já aparecia num livro escrito quando ela era criança.`, `Marie Antoinette said, "Let them eat cake."`, `There's no record she ever said this. The line was already appearing in a book written when she was a child.`],
["m52", "história", "M", `O imperador Calígula nomeou o próprio cavalo como cônsul de Roma.`, `Os historiadores antigos dizem que ele ameaçou ou brincou com a ideia. A nomeação nunca aconteceu.`, `Emperor Caligula appointed his own horse as a consul of Rome.`, `Ancient historians say he threatened it or joked about it. The appointment never actually happened.`],
["m53", "tabu", "M", `Na Idade Média, os senhores feudais tinham o direito legal de passar a noite de núpcias com a noiva de seus servos.`, `Não há prova de que essa lei tenha existido. A história foi espalhada séculos depois para pintar a Idade Média como bárbara.`, `In the Middle Ages, feudal lords had the legal right to spend the wedding night with their serfs' brides.`, `There's no proof this law ever existed. The story spread centuries later to paint the Middle Ages as barbaric.`],
["m54", "história", "M", `Cleópatra, a última rainha do Egito, descendia de uma linhagem de faraós egípcios com mais de mil anos.`, `A família dela era grega, da Macedônia, e governava o Egito havia uns 300 anos.`, `Cleopatra, Egypt's last queen, descended from a line of Egyptian pharaohs over a thousand years old.`, `Her family was Greek, from Macedonia, and had ruled Egypt for about 300 years.`],
["m55", "história", "M", `Os gladiadores romanos lutavam quase sempre até a morte.`, `Eram caros de treinar e manter. A maioria das lutas terminava com os dois vivos.`, `Roman gladiators almost always fought to the death.`, `They were expensive to train and keep. Most fights ended with both men alive.`],
["m56", "história", "M", `As pirâmides do Egito foram construídas por escravos.`, `Eram trabalhadores egípcios, alimentados e alojados pelo Estado. Seus túmulos ficam ao lado das pirâmides.`, `Egypt's pyramids were built by slaves.`, `They were Egyptian workers, fed and housed by the state. Their tombs sit right next to the pyramids.`],
["m57", "ciência", "M", `Isaac Newton descobriu a gravidade quando uma maçã caiu em sua cabeça.`, `Ele contou que viu uma maçã cair da árvore e ficou pensando. A maçã na cabeça foi acrescentada depois.`, `Isaac Newton discovered gravity when an apple fell on his head.`, `He said he saw an apple fall from a tree and started thinking. The apple on the head was added later.`],
["m58", "história", "M", `A dama de ferro, um caixão com espinhos por dentro, foi usada por tribunais alemães do século 14 para arrancar confissões.`, `Não há registro de uso medieval. As peças conhecidas foram montadas séculos depois, para museus e feiras.`, `The Iron Maiden, a spiked coffin, was used by German courts in the 14th century to force confessions.`, `There's no record of medieval use. The known pieces were assembled centuries later, for museums and fairs.`],
["m59", "história", "M", `A grande caça às bruxas realmente aconteceu na Europa durante a Idade Média.`, `Aconteceu, mas depois. O auge foi entre 1560 e 1630, já na Idade Moderna.`, `The great witch hunts really happened in Europe during the Middle Ages.`, `They did happen, but later. The peak was between 1560 and 1630, already in the Early Modern period.`],
["m60", "história", "M", `Na Idade Média, era raro alguém passar dos 40 anos.`, `A média de vida era baixa por causa da mortalidade infantil. Quem chegava à idade adulta costumava viver bem mais.`, `In the Middle Ages, it was rare for anyone to live past 40.`, `Average lifespan was low because of child mortality. Those who reached adulthood often lived much longer.`],
["m61", "história", "M", `Hitler criou as autoestradas alemãs.`, `A primeira foi inaugurada em 1932, antes de ele chegar ao poder. O regime apenas ampliou a rede e fez propaganda com ela.`, `Hitler created Germany's autobahns.`, `The first one opened in 1932, before he took power. His regime only expanded the network and used it for propaganda.`],
["m62", "cultura", "M", `O corpo de Walt Disney foi congelado para ser reanimado no futuro.`, `Ele foi cremado em 1966. O boato surgiu poucos anos depois e nunca mais parou.`, `Walt Disney's body was frozen to be revived in the future.`, `He was cremated in 1966. The rumor started a few years later and never really went away.`],
["m63", "história", "M", `Na quebra da Bolsa de 1929, dezenas de investidores se jogaram das janelas em Nova York.`, `Não houve onda de suicídios. A imagem veio de piadas e reportagens exageradas da época.`, `During the 1929 stock market crash, dozens of investors jumped from windows in New York.`, `There was no wave of suicides. The image came from jokes and exaggerated reporting at the time.`],
["m64", "cultura", "M", `Foi a Coca-Cola que vestiu o Papai Noel de vermelho.`, `Ele já aparecia de vermelho em ilustrações décadas antes dos anúncios da marca, que são de 1931.`, `It was Coca-Cola that dressed Santa Claus in red.`, `He already appeared in red in illustrations decades before the brand's ads, which date from 1931.`],

["m68", "cultura", "M", `A frase "Elementar, meu caro Watson" aparece logo no primeiro livro de Sherlock Holmes, de 1887.`, `O livro é de 1887, mas a frase não aparece em nenhuma história escrita por Conan Doyle.`, `The phrase "Elementary, my dear Watson" appears right in the first Sherlock Holmes book, from 1887.`, `The book is from 1887, but the phrase never appears in any story written by Conan Doyle.`],

["m76", "natureza", "M", `O tiranossauro viveu mais perto, no tempo, do estegossauro do que de nós.`, `É o contrário. Cerca de 80 milhões de anos separam os dois dinossauros, e 66 milhões separam o tiranossauro de nós.`, `The T-Rex lived closer in time to the Stegosaurus than to us.`, `It's the opposite. About 80 million years separate the two dinosaurs, and 66 million years separate the T-Rex from us.`],
["m77", "natureza", "M", `O Saara é o maior deserto do mundo.`, `É a Antártida. Deserto é toda região onde quase não chove nem neva.`, `The Sahara is the world's largest desert.`, `It's Antarctica. A desert is any region where it almost never rains or snows.`],
["m78", "espaço", "M", `Astronautas flutuam na Estação Espacial porque lá não há gravidade.`, `A gravidade ali é quase a mesma do chão. Eles flutuam porque a estação está em queda livre ao redor da Terra.`, `Astronauts float on the Space Station because there's no gravity up there.`, `Gravity there is almost the same as on the ground. They float because the station is in free fall around the Earth.`],
["m79", "espaço", "M", `A Lua tem um lado escuro que nunca recebe luz do Sol.`, `O lado que não vemos da Terra recebe tanta luz quanto o outro. É oculto, não escuro.`, `The Moon has a dark side that never gets sunlight.`, `The side we never see from Earth gets just as much light as the other. It's hidden, not dark.`],
["m80", "espaço", "M", `Mercúrio é o planeta mais quente do Sistema Solar.`, `É Vênus. A atmosfera densa retém o calor e mantém o planeta a mais de 460 °C.`, `Mercury is the hottest planet in the Solar System.`, `It's Venus. Its thick atmosphere traps heat and keeps the planet above 460°C.`],
["m81", "corpo", "M", `O ser humano tem exatamente cinco sentidos.`, `Há também equilíbrio, temperatura, dor e a noção da posição do próprio corpo, entre outros.`, `Human beings have exactly five senses.`, `There's also balance, temperature, pain, and the sense of your body's position, among others.`],
["m82", "corpo", "M", `Cabelos e unhas continuam crescendo depois da morte.`, `A pele desidrata e recua, o que dá a impressão de que cresceram.`, `Hair and nails keep growing after death.`, `The skin dehydrates and pulls back, which makes it look like they grew.`],
["m83", "bar", "M", `Cada bebedeira mata milhares de neurônios.`, `O álcool atrapalha a comunicação entre os neurônios, mas não os mata em massa. O abuso por anos, esse sim, causa danos.`, `Every binge kills thousands of neurons.`, `Alcohol disrupts communication between neurons, but doesn't kill them en masse. Years of abuse, though, does cause damage.`],
["m84", "bar", "M", `Café forte corta o efeito do álcool.`, `A cafeína deixa a pessoa mais acordada, mas igualmente bêbada.`, `Strong coffee sobers you up.`, `Caffeine makes you more awake, but just as drunk.`],
["m85", "bar", "M", `Misturar cerveja com destilado embebeda mais do que a mesma quantidade de álcool de um tipo só.`, `O que conta é o total de álcool. Quem mistura costuma beber mais sem perceber.`, `Mixing beer with liquor gets you drunker than the same amount of alcohol from one type alone.`, `What matters is the total alcohol. People who mix just tend to drink more without noticing.`],
["m86", "tabu", "M", `O tamanho do pé de um homem indica o tamanho do pênis.`, `Estudos que mediram as duas coisas não encontraram relação.`, `A man's shoe size indicates the size of his penis.`, `Studies that measured both found no connection.`],
["m87", "cultura", "M", `Van Gogh morreu sem ter vendido um único quadro.`, `Vendeu pelo menos um, "A Vinha Encarnada", em 1890, além de trocar obras por comida e material.`, `Van Gogh died without ever having sold a single painting.`, `He sold at least one, "The Red Vineyard," in 1890, and also traded works for food and supplies.`],
["m88", "portugal", "M", `O vinho do Porto é produzido e envelhecido na cidade do Porto.`, `As uvas e o vinho vêm do vale do Douro. As caves ficam em Vila Nova de Gaia, do outro lado do rio.`, `Port wine is produced and aged in the city of Porto.`, `The grapes and the wine come from the Douro Valley. The cellars are in Vila Nova de Gaia, across the river.`],
["m89", "história", "M", `Júlio César nasceu de cesariana, e é daí que vem o nome da cirurgia.`, `A mãe dele viveu por décadas, e na época a operação só era feita em mulheres mortas ou à beira da morte.`, `Julius Caesar was born by cesarean section, which is where the surgery gets its name.`, `His mother lived for decades afterward, and at the time the operation was only performed on women who were dead or dying.`],
["m90", "bar", "M", `O tomate faz parte da cozinha italiana desde o Império Romano.`, `O tomate veio das Américas e só chegou à Itália no século 16.`, `Tomatoes have been part of Italian cooking since the Roman Empire.`, `Tomatoes came from the Americas and only reached Italy in the 16th century.`],
["m91", "cultura", "M", `Big Ben é o nome da torre do relógio de Londres.`, `É o nome do sino. A torre se chama Elizabeth Tower.`, `Big Ben is the name of London's clock tower.`, `It's the name of the bell. The tower is called Elizabeth Tower.`],
["m92", "bar", "M", `Foi um monge francês, Dom Pérignon, quem inventou o champanhe ao descobrir como colocar bolhas no vinho.`, `Na época, as bolhas eram um defeito que estourava garrafas. Ele trabalhava justamente para eliminá-las.`, `It was a French monk, Dom Pérignon, who invented champagne by figuring out how to put bubbles in wine.`, `Back then, bubbles were a flaw that burst bottles. He actually worked to get rid of them.`],
["m93", "cultura", "M", `Einstein disse que "insanidade é fazer a mesma coisa esperando resultados diferentes".`, `Não há registro de que ele tenha dito isso. A frase apareceu décadas depois da morte dele.`, `Einstein said that "insanity is doing the same thing over and over and expecting different results."`, `There's no record of him ever saying that. The quote showed up decades after he died.`],
["m94", "portugal", "M", `A Revolução dos Cravos, que derrubou a ditadura em Portugal em 25 de abril de 1974, terminou sem uma única morte.`, `Quatro pessoas foram mortas a tiro pela polícia política, diante da sede dela, em Lisboa.`, `The Carnation Revolution, which overthrew Portugal's dictatorship on April 25, 1974, ended without a single death.`, `Four people were shot dead by the secret police, right outside their headquarters, in Lisbon.`],
["m95", "corpo", "M", `Fazer xixi em cima de uma queimadura de água-viva alivia a dor.`, `Pode até piorar. O indicado é lavar com água do mar ou vinagre.`, `Peeing on a jellyfish sting relieves the pain.`, `It can even make it worse. The right move is to rinse with seawater or vinegar.`],
["m96", "brasil", "M", `O formato de avião de Brasília foi escolhido de propósito pelo urbanista Lúcio Costa, para simbolizar um país que decolava rumo ao futuro.`, `Ele partiu de dois eixos que se cruzam, como o sinal da cruz, e não gostava da comparação com um avião.`, `Brasília's airplane shape was chosen on purpose by urban planner Lúcio Costa, to symbolize a country taking off toward the future.`, `He started from two crossing axes, like the sign of the cross, and he disliked the comparison to an airplane.`],
["m97", "esporte", "M", `A camisa amarela acompanha a seleção brasileira desde a primeira Copa do Mundo, em 1930, quando o time já entrou em campo de amarelo.`, `A seleção jogava de branco. O amarelo foi adotado depois da derrota de 1950 e estreou em Copas em 1954.`, `The yellow jersey has been with Brazil's national team since the first World Cup, in 1930, when the team already played in yellow.`, `The team played in white. Yellow was adopted after the 1950 defeat and debuted at World Cups in 1954.`],
["m98", "natureza", "M", `A Amazônia produz a maior parte do oxigênio que respiramos.`, `A floresta consome quase todo o oxigênio que produz. A maior parte do que respiramos vem dos oceanos.`, `The Amazon produces most of the oxygen we breathe.`, `The forest consumes almost all the oxygen it produces. Most of what we breathe comes from the oceans.`],
["m99", "bar", "M", `O absinto pode causar alucinações, e foi por isso que acabou proibido em vários países da Europa.`, `A proibição existiu, mas por um medo sem base. O efeito do absinto é só o do álcool, que é muito forte.`, `Absinthe can cause hallucinations, which is why it ended up banned in several European countries.`, `The ban was real, but based on an unfounded fear. Absinthe's effect is just that of alcohol, which is very strong.`],
["m100", "bar", "M", `A tequila tradicional mexicana é engarrafada com uma larva no fundo.`, `A larva aparece em alguns mezcais, outra bebida, e foi criada como truque de marketing no século 20.`, `Traditional Mexican tequila is bottled with a worm at the bottom.`, `The worm shows up in some mezcals, a different drink, and was created as a marketing gimmick in the 20th century.`],
["m101", "corpo", "M", `Acordar um sonâmbulo de repente é perigoso, porque o susto pode provocar um infarto ou deixá-lo em estado de choque.`, `Ele acorda confuso e mais nada. Perigoso é deixá-lo andar pela casa.`, `Waking a sleepwalker suddenly is dangerous, because the shock can cause a heart attack or put them into shock.`, `They just wake up confused, nothing more. What's dangerous is letting them walk around the house.`],
["m102", "portugal", "M", `D. Pedro I de Portugal mandou coroar Inês de Castro depois de morta e obrigou a corte a beijar a mão do cadáver.`, `A cena só aparece em textos escritos cerca de 200 anos depois. Ele declarou que tinha casado com ela, mas a coroação do cadáver é lenda.`, `Dom Pedro I of Portugal had Inês de Castro crowned after her death and forced the court to kiss the corpse's hand.`, `The scene only appears in texts written about 200 years later. He declared he had married her, but the coronation of the corpse is legend.`],
["m103", "portugal", "M", `A palavra japonesa "arigatô" vem do português "obrigado".`, `A palavra já existia no japonês séculos antes da chegada dos portugueses.`, `The Japanese word "arigato" comes from the Portuguese "obrigado."`, `The word already existed in Japanese centuries before the Portuguese arrived.`],
["m104", "esporte", "M", `A Índia desistiu da Copa de 1950, no Brasil, porque a FIFA proibiu seus jogadores de jogar descalços.`, `A federação indiana alegou falta de tempo e de dinheiro para a viagem, e dava mais valor às Olimpíadas.`, `India pulled out of the 1950 World Cup, in Brazil, because FIFA banned its players from playing barefoot.`, `The Indian federation cited lack of time and money for the trip, and cared more about the Olympics.`],
["m105", "brasil", "M", `O nome "Brasil" vem de uma palavra tupi que significa "terra vermelha".`, `Vem do pau-brasil, árvore cuja madeira tem cor de brasa.`, `The name "Brazil" comes from a Tupi word meaning "red earth."`, `It comes from brazilwood, a tree whose wood is the color of embers.`],
["m106", "brasil", "M", `O Carnaval foi trazido ao Brasil pelos africanos escravizados.`, `A festa chegou com os portugueses, como entrudo. As influências africanas vieram depois e transformaram a festa.`, `Carnival was brought to Brazil by enslaved Africans.`, `The festival arrived with the Portuguese, as "entrudo." African influences came later and transformed it.`],
["m107", "portugal", "M", `Nenhuma capital europeia fica mais a oeste do que Lisboa.`, `Reykjavik, na Islândia, fica bem mais a oeste.`, `No European capital lies farther west than Lisbon.`, `Reykjavik, in Iceland, lies much farther west.`],
["m108", "brasil", "M", `Brasília foi a segunda capital do Brasil, depois do Rio de Janeiro.`, `Foi a terceira. A primeira foi Salvador, de 1549 a 1763.`, `Brasília was Brazil's second capital, after Rio de Janeiro.`, `It was the third. The first was Salvador, from 1549 to 1763.`],
["m109", "portugal", "M", `O ponto mais alto de Portugal fica na Serra da Estrela.`, `É a montanha do Pico, nos Açores, com 2.351 metros. A Serra da Estrela é o ponto mais alto do continente.`, `Portugal's highest point is in the Serra da Estrela.`, `It's Mount Pico, in the Azores, at 2,351 meters. Serra da Estrela is only the highest point on the mainland.`],
["m110", "portugal", "M", `O bacalhau da cozinha portuguesa é pescado há séculos na costa norte de Portugal.`, `O bacalhau vive em águas frias e vem da Noruega, da Islândia e do Canadá.`, `The cod used in Portuguese cooking has been fished for centuries off Portugal's own northern coast.`, `Cod lives in cold waters and comes from Norway, Iceland, and Canada.`],
["m111", "cultura", "M", `A palavra "gringo" surgiu quando mexicanos gritavam "green, go!" para soldados americanos de uniforme verde.`, `A palavra já era usada na Espanha antes disso. Vem de "griego", grego, no sentido de língua que não se entende.`, `The word "gringo" started when Mexicans shouted "green, go!" at American soldiers in green uniforms.`, `The word was already used in Spain before that. It comes from "griego," Greek, meaning a language nobody could understand.`],
["m112", "história", "M", `Em 1456, um papa excomungou o cometa Halley.`, `A história foi inventada séculos depois. O papa apenas pediu orações por causa de uma guerra.`, `In 1456, a pope excommunicated Halley's Comet.`, `The story was invented centuries later. The pope only called for prayers because of a war.`],
["m113", "tabu", "M", `Os romanos faziam juramentos segurando os próprios testículos, e é daí que vem a palavra "testemunha".`, `Não há registro desse costume. As duas palavras são aparentadas em latim, mas o juramento é invenção.`, `Romans swore oaths while holding their own testicles, and that's supposedly where the word "testify" comes from.`, `There's no record of this custom. The two words share a Latin root, but the oath itself is an invention.`],
["m114", "história", "M", `Na Idade Média, as especiarias serviam para disfarçar o gosto de carne estragada.`, `As especiarias custavam muito mais que a carne. Quem podia pagá-las comia carne fresca.`, `In the Middle Ages, spices were used to mask the taste of spoiled meat.`, `Spices cost far more than meat. Whoever could afford them ate fresh meat.`],

["m116", "história", "M", `Piratas como o Barba Negra enterravam parte do saque em ilhas desertas e guardavam mapas cifrados para voltar depois.`, `Os piratas dividiam e gastavam o saque depressa. O mapa do tesouro vem do romance "A Ilha do Tesouro".`, `Pirates like Blackbeard buried part of their loot on deserted islands and kept coded maps to come back for it later.`, `Pirates split up and spent their loot fast. The treasure map comes from the novel "Treasure Island."`],
["m117", "história", "M", `As armaduras medievais eram tão pesadas que os cavaleiros precisavam de um guindaste para montar a cavalo.`, `Uma armadura completa pesava de 20 a 25 kg, bem distribuídos. Dava para correr e montar sem ajuda.`, `Medieval armor was so heavy that knights needed a crane to mount their horses.`, `A full suit of armor weighed 20 to 25 kg, well distributed. You could run and mount a horse without help.`],
["m118", "história", "M", `Os navios de guerra da Roma Antiga eram movidos por escravos acorrentados aos remos.`, `Os remadores eram homens livres e treinados. A imagem dos escravos acorrentados vem de romances e filmes.`, `Ancient Rome's warships were powered by slaves chained to the oars.`, `The rowers were free, trained men. The image of chained slaves comes from novels and movies.`],
["m119", "história", "M", `Antes de cada combate, os gladiadores saudavam o imperador com a frase "Ave, César, os que vão morrer te saúdam".`, `Há um único registro da frase, dita por prisioneiros condenados numa batalha naval encenada.`, `Before each fight, gladiators saluted the emperor with the line "Hail Caesar, we who are about to die salute you."`, `There's only one record of the line, spoken by condemned prisoners in a staged naval battle.`],
["m120", "cultura", "M", `A Torre Eiffel foi desenhada pelo próprio Gustave Eiffel.`, `O projeto é de dois engenheiros da empresa dele. Eiffel comprou os direitos e construiu.`, `The Eiffel Tower was designed by Gustave Eiffel himself.`, `The design is by two engineers at his company. Eiffel bought the rights and built it.`],
["m121", "cultura", "M", `Mozart morreu envenenado pelo compositor rival Antonio Salieri.`, `Não há qualquer evidência. Mozart morreu de doença, e a história ganhou força com uma peça de teatro e um filme.`, `Mozart died poisoned by his rival composer Antonio Salieri.`, `There's no evidence for it at all. Mozart died of illness, and the story caught on thanks to a play and a movie.`],

["m123", "história", "M", `A Suíça, neutra desde 1815, aboliu o exército depois da Segunda Guerra e hoje mantém apenas uma guarda de fronteira.`, `A Suíça tem exército e serviço militar obrigatório. A abolição foi proposta e rejeitada em plebiscito.`, `Switzerland, neutral since 1815, abolished its army after World War II and today keeps only a border guard.`, `Switzerland has an army and mandatory military service. Abolition was proposed and rejected in a referendum.`],
["m124", "cultura", "M", `O sinal de socorro SOS significa "Save Our Souls".`, `As letras não significam nada. Foram escolhidas por serem fáceis de transmitir em código Morse.`, `The distress signal SOS stands for "Save Our Souls."`, `The letters don't stand for anything. They were picked because they're easy to send in Morse code.`],
["m125", "cultura", "M", `Sócrates escreveu a frase "só sei que nada sei" na "Apologia", o livro em que narra a própria defesa no tribunal que o condenou à morte.`, `A "Apologia" foi escrita por Platão. Sócrates não deixou nada escrito.`, `Socrates wrote "I know that I know nothing" in the "Apology," the book where he recounts his own defense at the trial that sentenced him to death.`, `The "Apology" was written by Plato. Socrates left nothing in writing.`],
["m126", "cultura", "M", `A frase "os fins justificam os meios" abre o capítulo mais famoso de "O Príncipe", de Maquiavel, publicado em 1532.`, `A data é real, mas a frase não aparece em lugar nenhum do livro.`, `The phrase "the ends justify the means" opens the most famous chapter of Machiavelli's "The Prince," published in 1532.`, `The date is real, but the phrase doesn't appear anywhere in the book.`],

["m128", "cultura", "M", `Os sete pecados capitais estão listados no Novo Testamento, numa carta do apóstolo Paulo aos cristãos de Roma.`, `A lista não está na Bíblia. Foi organizada por um papa no século 6.`, `The seven deadly sins are listed in the New Testament, in a letter from the apostle Paul to the Christians of Rome.`, `The list isn't in the Bible. It was compiled by a pope in the 6th century.`],
["m129", "cultura", "M", `O Buda histórico era o monge gordo e sorridente das estátuas.`, `A figura gorda e risonha é outro monge, chinês, que viveu mais de mil anos depois.`, `The historical Buddha was the fat, smiling monk from the statues.`, `The fat, laughing figure is a different monk, Chinese, who lived more than a thousand years later.`],
["m130", "tabu", "M", `O Kama Sutra é um catálogo ilustrado de posições sexuais, encomendado por um marajá indiano para educar os filhos.`, `É um tratado antigo sobre convivência, sedução e vida a dois. As posições ocupam uma pequena parte, e o original nem tinha ilustrações.`, `The Kama Sutra is an illustrated catalog of sex positions, commissioned by an Indian maharaja to educate his children.`, `It's an ancient treatise on companionship, seduction, and life as a couple. Positions take up a small part, and the original wasn't even illustrated.`],
["m131", "ciência", "M", `O petróleo é formado por restos de dinossauros.`, `O petróleo vem sobretudo de plâncton e algas microscópicas que se acumularam no fundo de mares antigos.`, `Oil is formed from dinosaur remains.`, `Oil comes mainly from plankton and microscopic algae that piled up on the floor of ancient seas.`],
["m132", "ciência", "M", `Os diamantes são carvão comprimido durante milhões de anos.`, `Os diamantes se formam muito mais fundo na Terra, e a maioria é mais antiga que as plantas que deram origem ao carvão.`, `Diamonds are coal compressed over millions of years.`, `Diamonds form much deeper inside the Earth, and most are older than the plants that gave rise to coal.`],

["m134", "ciência", "M", `No hemisfério sul, a água do ralo gira no sentido contrário ao do hemisfério norte.`, `Numa pia, o que manda é o formato do ralo e o movimento que a água já tinha. O efeito da rotação da Terra só aparece em furacões.`, `In the southern hemisphere, water spirals down the drain the opposite way from the northern hemisphere.`, `In a sink, it's the drain's shape and the motion the water already had that decide it. The Earth's rotation only shows up in hurricanes.`],

["m136", "tecnologia", "M", `Usar o celular em um posto de gasolina pode provocar uma explosão.`, `Não há caso confirmado. Os incêndios registrados em postos foram causados por eletricidade estática.`, `Using a cell phone at a gas station can cause an explosion.`, `There's no confirmed case. Fires at gas stations have been caused by static electricity.`],

["m138", "tecnologia", "M", `O mouse de computador foi inventado pela Apple.`, `O mouse foi criado pelo engenheiro Douglas Engelbart nos anos 1960. A Apple o popularizou duas décadas depois.`, `The computer mouse was invented by Apple.`, `The mouse was created by engineer Douglas Engelbart in the 1960s. Apple popularized it two decades later.`],

  if (S.screen === "play" && S.phase === "reveal" && S.mode === "coop") { /* a bolha só reage depois que a cortina da revelação sai */
    const el = $("bub"), c = S.co;
    setTimeout(() => { if (!el.isConnected) return; el.style.setProperty("--s", bubSize(c.lvl)); el.dataset.run = c.run; $("bubtxt").textContent = bubText(c.lvl, c.run); vib(c.hit ? 40 : [80,60,80]);
      if (S.over) setTimeout(() => { if (!el.isConnected) return; const won = c.lvl >= S.target;
        el.scrollIntoView({ behavior:"smooth", block:"center" }); el.classList.add(won ? "burst" : "flat"); if (!won) el.style.setProperty("--s", "4%");
        $("bubtxt").textContent = won ? "a bolha estourou" : "a bolha murchou"; ["fin","fintxt","finbtn"].forEach(id => $(id).hidden = false); vib(won ? [60,40,60,40,300] : [400]); }, 1300);
    }, (S.decisive ? 2600 : 900) + 1700);
  }
  cancelAnimationFrame(slRaf); slRaf = null; if (S.screen === "setup") { initSlider(); placeLens(false); }
  justAdded = false;
  runTimer();
}

function placeLens(anim){
  const box = $("lens"), top = $("lenstop"); if (!box) return;
  const b = box.querySelector(`button[data-v="${S.len || "m"}"]`), l = b.offsetLeft, r = box.clientWidth - l - b.offsetWidth, prev = parseFloat(top.style.getPropertyValue("--l")) || 0;
  top.classList.toggle("noanim", !anim); top.classList.toggle("left", l < prev);
  top.style.setProperty("--l", l + "px"); top.style.setProperty("--r", r + "px");
}
/* Slider de tempo: o asterisco rola, estica com a velocidade, quica ao soltar e continua girando por inércia. */
function initSlider(){
  const sl = $("sl"), th = $("slt"), fill = $("slf"), ast = th.firstElementChild, lab = $("tval");
  const snap = p => { let s = Math.round(p * 20) * 15; if (s === 15) s = p * 300 < 15 ? 0 : 30; return s; };
  let tx = Math.min(1, S.timer / 300), x = tx, v = 0, ang = x * 700, w = 0, drag = false, cur = S.timer;
  const show = s => { const nc = L().noClock; lab.textContent = s ? fmt(s) : nc; sl.setAttribute("aria-valuenow", s); sl.setAttribute("aria-valuetext", s ? fmt(s) : nc); };
  const draw = () => { const W = sl.clientWidth, px = 28 + x * (W - 56), st = 1 + Math.min(.3, Math.abs(v) * 9) * Math.min(1, Math.min(x, 1 - x) * 8);
    th.style.transform = `translateX(${px.toFixed(1)}px) scale(${st.toFixed(3)},${(1 / st).toFixed(3)})`; ast.style.transform = `rotate(${ang.toFixed(1)}deg)`; fill.style.transform = `scaleX(${(px / W).toFixed(4)})`; };
  let lt = 0;
  const loop = ts => {
    if (!sl.isConnected) { slRaf = null; return; }
    const f = lt ? Math.min(2, (ts - lt) / 16.7) : 1; lt = ts;
    if (STILL) { x = tx; v = 0; w = 0; }
    else { /* mola calculada por tempo (igual em telas de 60 e 120 Hz) e presa às pontas do trilho */
      v += (tx - x) * 0.13 * f; v *= Math.pow(0.78, f); let dx = v * f; x += dx;
      if (x < 0) { dx -= x; x = 0; v = Math.abs(v) * 0.2; } else if (x > 1) { dx -= x - 1; x = 1; v = -Math.abs(v) * 0.2; }
      const roll = dx * (sl.clientWidth - 56) / 28 * 57.3; w = w * Math.pow(0.955, f) + roll * 0.3; ang += roll + w * f; }
    draw();
    slRaf = (drag || Math.abs(v) > 0.0004 || Math.abs(tx - x) > 0.0004 || Math.abs(w) > 0.08) ? requestAnimationFrame(loop) : null;
    if (!slRaf) lt = 0;
  };
  const kick = () => { if (!slRaf) slRaf = requestAnimationFrame(loop); };
  const set = p => { tx = Math.max(0, Math.min(1, p)); const s = snap(tx); if (s !== cur) { cur = s; S.timer = s; show(s); vib(8); } kick(); };
  const at = e => { const r = sl.getBoundingClientRect(); return (e.clientX - r.left - 28) / (r.width - 56); };
  sl.addEventListener("pointerdown", e => { drag = true; try { sl.setPointerCapture(e.pointerId); } catch (err) {} set(at(e)); });
  sl.addEventListener("pointermove", e => { if (drag) set(at(e)); });
  const end = () => { if (!drag) return; drag = false; tx = cur / 300; kick(); };
  sl.addEventListener("pointerup", end); sl.addEventListener("pointercancel", end);
  sl.addEventListener("keydown", e => { const d = (e.key === "ArrowRight" || e.key === "ArrowUp") ? 1 : (e.key === "ArrowLeft" || e.key === "ArrowDown") ? -1 : 0; if (!d) return;
    e.preventDefault(); let s = cur + d * 15; if (s === 15) s = d > 0 ? 30 : 0; s = Math.max(0, Math.min(300, s)); tx = s / 300; set(tx); });
  draw();
}

/* Nomes flutuando: deriva lenta, inércia ao soltar, empurrão suave entre eles. O lado em que o nome está é o voto. */
function initArena(){
  arena = $("arena"); const W = arena.clientWidth, H = arena.clientHeight;
  bodies = [...arena.querySelectorAll(".chip")].map(el => {
    const w = el.offsetWidth, h = el.offsetHeight, i = el.dataset.i, v = S.votes[i];
    const band = v === "V" ? [0.1, 0.26] : v === "M" ? [0.74, 0.9] : [0.43, 0.57];
    return { el, i, w, h, x: 8 + Math.random() * Math.max(1, W - w - 16), y: H * (band[0] + Math.random() * (band[1] - band[0])) - h / 2,
      vx: (Math.random() - .5) * 1.4, vy: (Math.random() - .5) * 1.4, rot: (Math.random() - .5) * 12, ph: Math.random() * 6.28, zone: null, drag: false, free: false, anchor: v || "", team: el.dataset.t || "" };
  });
  last = 0; raf = requestAnimationFrame(frame);
}
function frame(ts){
  if (!arena || !arena.isConnected) { raf = null; return; }
  const f = last ? Math.min(2.5, (ts - last) / 16.7) : 1; last = ts;
  const W = arena.clientWidth, H = arena.clientHeight, damp = Math.pow(0.975, f);
  for (let a = 0; a < bodies.length; a++) for (let b = a + 1; b < bodies.length; b++) {
    const A = bodies[a], B = bodies[b], dx = (B.x + B.w / 2) - (A.x + A.w / 2), dy = (B.y + B.h / 2) - (A.y + A.h / 2);
    const d = Math.hypot(dx, dy) || 0.01, min = (A.w + A.h + B.w + B.h) / 4;
    if (d < min) { const p = (min - d) * 0.035 * f, nx = dx / d, ny = dy / d;
      if (!A.drag) { A.vx -= nx * p; A.vy -= ny * p; } if (!B.drag) { B.vx += nx * p; B.vy += ny * p; } }
  }
  let n = 0;
  bodies.forEach(b => {
    if (!b.drag) {
      const cy = (b.y + b.h / 2) / H;
      if (!STILL) { b.vx += Math.cos(ts / 1700 + b.ph) * 0.006 * f; b.vy += Math.sin(ts / 2300 + b.ph * 1.7) * 0.006 * f; }
      /* Campo magnético: nome solto num lado fica ancorado nele; batidas empurram mas não tiram do lado. */
      const top = b.anchor === "V" ? 0 : b.anchor === "M" ? 0.72 : 0.41, bot = b.anchor === "V" ? 0.28 : b.anchor === "M" ? 1 : 0.59;
      if (b.free) { if (Math.hypot(b.vx, b.vy) < 0.7) { b.free = false; b.anchor = cy < 0.36 ? "V" : cy > 0.64 ? "M" : ""; } }
      else if (cy < top) b.vy += (top - cy) * H * 0.012 * f; else if (cy > bot) b.vy -= (cy - bot) * H * 0.012 * f;
      b.vx *= damp; b.vy *= damp; b.x += b.vx * f; b.y += b.vy * f;
      if (!b.free) { const lo = (b.anchor === "M" ? 0.655 : b.anchor === "V" ? 0 : 0.375) * H - b.h / 2, hi = (b.anchor === "V" ? 0.345 : b.anchor === "M" ? 1 : 0.625) * H - b.h / 2;
        if (b.y < lo) { b.y = lo; b.vy = Math.max(b.vy, 0); } else if (b.y > hi) { b.y = hi; b.vy = Math.min(b.vy, 0); } }
      if (b.x < 4) { b.x = 4; b.vx = Math.abs(b.vx) * .6; } else if (b.x > W - b.w - 4) { b.x = W - b.w - 4; b.vx = -Math.abs(b.vx) * .6; }
      if (b.y < 4) { b.y = 4; b.vy = Math.abs(b.vy) * .6; } else if (b.y > H - b.h - 4) { b.y = H - b.h - 4; b.vy = -Math.abs(b.vy) * .6; }
    }
    const c = (b.y + b.h / 2) / H, z = (b.drag || b.free) ? (c < 0.36 ? "V" : c > 0.64 ? "M" : "") : b.anchor;
    if (z !== b.zone) { b.zone = z; b.el.classList.toggle("in", !!z); if (b.team) b.el.classList.toggle("trai", !!z && z !== b.team); }
    if (z) n++;
    b.el.style.transform = `translate3d(${b.x.toFixed(1)}px,${b.y.toFixed(1)}px,0) rotate(${(b.rot + b.vx * 2.2).toFixed(1)}deg)`;
  });
  if (n !== decided) { decided = n; const btn = $("flip"), left = bodies.length - n, T = L();
    if (btn) { btn.disabled = left > 0; btn.textContent = left > 0 ? (S.mode === "coop" ? T.decide : left === 1 ? T.oneLeft : T.nLeft(left)) : T.flipCard; }
    const mid = $("mid"); if (mid) mid.style.opacity = n > 0 ? 0 : 1; }
  raf = requestAnimationFrame(frame);
}
const pt = e => { const r = arena.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
$app.addEventListener("pointerdown", e => {
  const el = e.target.closest(".chip"); if (!el) return; const b = bodies.find(x => x.el === el); if (!b) return;
  const [px, py] = pt(e); grab = { b, ox: px - b.x, oy: py - b.y }; b.drag = true; b.vx = b.vy = 0; el.classList.add("held");
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
});
$app.addEventListener("pointermove", e => {
  if (!grab) return; const b = grab.b, [px, py] = pt(e), W = arena.clientWidth, H = arena.clientHeight;
  const nx = Math.max(4, Math.min(W - b.w - 4, px - grab.ox)), ny = Math.max(4, Math.min(H - b.h - 4, py - grab.oy));
  b.vx = b.vx * .5 + (nx - b.x) * .5; b.vy = b.vy * .5 + (ny - b.y) * .5; b.x = nx; b.y = ny;
});
function release(){ if (!grab) return; const b = grab.b; grab = null; b.drag = false; b.free = true; b.el.classList.remove("held");
  const sp = Math.hypot(b.vx, b.vy), max = 24; if (sp > max) { b.vx *= max / sp; b.vy *= max / sp; } }
$app.addEventListener("pointerup", release);
$app.addEventListener("pointercancel", release);

$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return; const a = b.dataset.act;
  const warn = () => { const min = minFor(S.mode), ok = S.names.length >= min, w = $("modewarn"); w.hidden = ok; w.textContent = `este modo precisa de pelo menos ${min} jogadores.`; $("startbtn").disabled = !ok; };
  if (a === "lang") { S.lang = S.lang === "pt" ? "en" : "pt"; langStore.set(S.lang); render(); return; }
  if (a === "debate") { S.debating = true; $("cardsheet").hidden = true; return; }
  if (a === "reread") { $("cardsheet").hidden = false; return; }
  if (a === "board") { const s = $("boardsheet"); s.hidden = !s.hidden; return; }
  if (a === "intro") { S.intro = false; howSeen.set(S.mode); $("introsheet").hidden = true; return; }
  if (a === "reveal") return reveal();
  if (a === "start" || a === "again") return newGame(a === "start");
  if (a === "next") { if (!S.over) return nextRound(); S.screen = "end"; }
  if (a === "help") { const s = $("helpsheet"); $("helpbody").innerHTML = howto(S.mode); s.hidden = !s.hidden; return; }
  if (a === "len") { S.len = b.dataset.v; document.querySelectorAll("#lens > button").forEach(m => m.setAttribute("aria-pressed", m === b)); placeLens(true); vib(10); return; }
  if (a === "mode") { /* a tinta nasce no ponto do toque e enche o botão; o outro esvazia */
    if (e.detail) { const r = b.getBoundingClientRect(); b.style.setProperty("--ox", (e.clientX - r.left) + "px"); b.style.setProperty("--oy", (e.clientY - r.top) + "px"); }
    S.mode = b.dataset.v; document.querySelectorAll(".mode").forEach(m => m.setAttribute("aria-pressed", m === b));
    warn(); vib(10); return; }
  if (a === "sub") { S.sub = S.mode = b.dataset.v; document.querySelectorAll("#subs > button").forEach(m => m.setAttribute("aria-pressed", m === b)); warn(); vib(10); return; }
  if (a === "rm") { S.names.splice(+b.dataset.i, 1); S.example = false; store.set(S.names); }
  else if (a === "end") S.screen = "end";
  else if (a === "setup") S.screen = "setup";
  render();
});
$app.addEventListener("submit", e => {
  e.preventDefault(); const inp = $("newname"), n = inp.value.trim();
  if (!n) return; if (S.example) { S.names = []; S.example = false; }
  if (!S.names.includes(n) && S.names.length < 12) { S.names.push(n); justAdded = true; }
  store.set(S.names); render(); $("newname").focus();
});
$app.addEventListener("input", e => { if (e.target.id === "newname") { const b = $("addbtn"); if (b) b.classList.toggle("ready", !!e.target.value.trim()); } });
window.claude?.hot?.snapshot?.(() => { readVotes(); return S; });
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start({});
