<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bate</title>
<meta name="description" content="Verdade ou mentira? Convencer vale mais do que estar certo.">
<meta name="theme-color" content="#0E1F1A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Bate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Fanzine em risografia: verde-garrafa quase preto, formas chapadas em cobalto e rosa fluorescente com contorno fora de registro.
     Layout: tela cheia de celular; verdade em cima, mentira embaixo, nomes soltos flutuando no meio. */
  --ground:#0E1F1A;
  --cream:#F2E8D5;
  --pink:#FF4FA3;
  --cobalt:#2F4BFF;
  --sage:#C9D2C4;
  --display:"Bricolage Grotesque","Arial Black",sans-serif;
  --mono:"IBM Plex Mono","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--cream);font-family:var(--display);font-weight:500;font-size:18px;line-height:1.35;overflow-x:hidden}
#app{max-width:480px;height:100%;margin:0 auto;position:relative}
h1,h2,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.page{padding:28px 24px 44px;display:flex;flex-direction:column;gap:22px;min-height:100%}
.wm{font-weight:800;letter-spacing:-.04em;text-transform:lowercase;line-height:.86}
.wm i{font-style:normal;color:var(--pink)}
.wm.big{font-size:clamp(76px,25vw,112px);margin-top:10px}
.wm.small{font-size:24px}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);font-weight:400}
.group{display:flex;flex-direction:column;gap:10px}
.names{display:flex;flex-wrap:wrap;gap:8px}
.tagn{background:var(--cream);color:var(--ground);font-weight:800;font-size:18px;letter-spacing:-.02em;text-transform:lowercase;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;overflow-wrap:anywhere;max-width:100%}
.tagn:nth-child(3n){border-radius:52% 48% 46% 54% / 60% 56% 44% 40%}
.tagn:nth-child(3n+1){border-radius:46% 54% 52% 48% / 54% 44% 56% 46%}
.tagn:nth-child(3n+2){border-radius:56% 44% 48% 52% / 50% 58% 42% 50%}
.tagn .x{font-family:var(--mono);font-size:18px;line-height:1;padding:2px 4px}
.tagn b{color:var(--cobalt);font-weight:800}
.addrow{display:flex;gap:8px}
input[type=text],select{font-family:var(--mono);font-size:16px;color:var(--cream);background:transparent;border:1.5px solid var(--cream);border-radius:999px;padding:11px 16px;min-width:0}
input[type=text]{flex:1}
input::placeholder{color:var(--sage)}
select option{color:#111}
.pill{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--cream);border-radius:999px;padding:9px 14px;white-space:nowrap}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1.5px solid var(--cream);padding:14px 14px 16px;text-align:left;font-weight:800;font-size:26px;letter-spacing:-.03em;text-transform:lowercase;line-height:1;border-radius:34px 42px 30px 46px / 40px 30px 46px 34px}
.mode span{display:block;font-family:var(--mono);font-weight:400;font-size:11.5px;letter-spacing:.04em;line-height:1.35;margin-top:8px;text-transform:none}
.mode{position:relative;overflow:hidden;isolation:isolate;transition:color .35s,border-color .35s}
.mode .ink{position:absolute;z-index:-1;left:var(--ox,50%);top:var(--oy,50%);width:330%;aspect-ratio:1;background:var(--pink);border-radius:42% 58% 50% 50% / 56% 42% 58% 44%;
  transform:translate(-50%,-50%) scale(0) rotate(-30deg);transition:transform .75s cubic-bezier(.3,.9,.3,1)}
.mode[data-v="equipes"] .ink{background:var(--cobalt)}
.mode[aria-pressed="true"] .ink{transform:translate(-50%,-50%) scale(1) rotate(40deg)}
.mode[aria-pressed="true"]{border-color:var(--pink);color:var(--ground)}
.mode[data-v="equipes"][aria-pressed="true"]{border-color:var(--cobalt);color:var(--cream)}
.go{background:var(--cream);color:var(--ground);font-weight:800;font-size:24px;letter-spacing:-.03em;text-transform:lowercase;padding:14px 26px;border-radius:999px}
.go.wide{width:100%}
.go:disabled{background:transparent;color:var(--sage);border:1.5px dashed var(--sage);cursor:not-allowed}
.go:active:not(:disabled){transform:scale(.97)}
/* jogo */
.play{position:relative;height:100%;min-height:560px;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;position:relative;z-index:3}
.arena{position:relative;flex:1;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.blob{position:absolute;left:-18%;width:118%;height:44%;pointer-events:none;animation:morph 14s ease-in-out infinite alternate}
.blob.bv{top:-9%;background:var(--cobalt);border-radius:38% 62% 46% 54% / 40% 44% 56% 60%;transform:rotate(-5deg)}
.blob.bm{bottom:-10%;left:auto;right:-20%;background:var(--pink);border-radius:58% 42% 62% 38% / 56% 60% 40% 44%;transform:rotate(5deg);animation-delay:-6s}
.blob.ol{background:none;border:2px solid var(--cream);margin:12px 0 0 14px}
.blob.bm.ol{margin:-14px 12px 0 0}
@keyframes morph{to{border-radius:56% 44% 58% 42% / 52% 58% 42% 48%}}
.zl{position:absolute;font-weight:800;font-size:44px;letter-spacing:-.04em;text-transform:lowercase;line-height:1;pointer-events:none}
.zl.v{left:20px;top:10px}.zl.m{right:20px;bottom:12px;color:var(--ground)}
.team{position:absolute;font-family:var(--mono);font-size:12px;letter-spacing:.04em;line-height:1.35;max-width:62%;pointer-events:none}
.team.v{left:22px;top:60px}.team.m{right:22px;bottom:62px;text-align:right;color:var(--ground)}
.mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;pointer-events:none;transition:opacity .4s}
.chip{position:absolute;left:0;top:0;height:50px;padding:0 20px;font-weight:800;font-size:19px;letter-spacing:-.02em;text-transform:lowercase;white-space:nowrap;
  border:2px solid var(--cream);background:var(--ground);color:var(--cream);border-radius:52% 48% 46% 54% / 60% 56% 44% 40%;touch-action:none;cursor:grab;will-change:transform;transition:background .25s,color .25s}
.chip:nth-child(odd){border-radius:46% 54% 52% 48% / 54% 44% 56% 46%}
.chip.in{background:var(--cream);color:var(--ground)}
.chip.held{cursor:grabbing;z-index:2;box-shadow:6px 8px 0 rgba(14,31,26,.45)}
.sheet{position:absolute;inset:0;z-index:5;background:var(--ground);padding:26px 24px 30px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.sheet[hidden]{display:none}
.stmt{font-weight:800;font-size:clamp(30px,8.6vw,40px);line-height:1;letter-spacing:-.035em;text-wrap:balance}
.push{margin-top:auto;display:flex;flex-direction:column;gap:12px}
/* revelação */
.verdict{align-self:flex-start;font-weight:800;font-size:clamp(56px,18vw,80px);letter-spacing:-.05em;text-transform:lowercase;line-height:.9;padding:22px 34px 28px;margin:4px 0 4px -10px;animation:plop .5s cubic-bezier(.2,1.5,.4,1)}
.verdict.v{background:var(--cobalt);color:var(--cream);border-radius:60% 40% 52% 48% / 46% 62% 38% 54%;transform:rotate(-4deg);box-shadow:10px 12px 0 -2px var(--ground),10px 12px 0 0 var(--cream)}
.verdict.m{background:var(--pink);color:var(--ground);border-radius:42% 58% 36% 64% / 60% 40% 60% 40%;transform:rotate(3deg);box-shadow:10px 12px 0 -2px var(--ground),10px 12px 0 0 var(--cream)}
@keyframes plop{from{transform:scale(.4) rotate(-12deg)}}
.why{font-size:20px;line-height:1.36}
.quote{font-family:var(--mono);font-size:13.5px;line-height:1.45;color:var(--sage)}
.solo{font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.05;text-transform:lowercase}
.solo i{font-style:normal;color:var(--pink)}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1.5px solid rgba(242,232,213,.3);font-weight:800;font-size:24px;letter-spacing:-.03em;text-transform:lowercase;overflow-wrap:anywhere}
.rank li span:last-child{font-family:var(--mono);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:0;text-align:right}
.rank small{display:block;font-family:var(--mono);font-weight:400;font-size:11.5px;letter-spacing:.04em;color:var(--sage);text-transform:none}
.champ{font-weight:800;font-size:clamp(64px,21vw,104px);letter-spacing:-.05em;line-height:.86;text-transform:lowercase;overflow-wrap:anywhere}
.addbtn{flex:none;width:54px;height:54px;background:var(--pink);color:var(--ground);display:grid;place-items:center;border-radius:52% 48% 46% 54% / 60% 56% 44% 40%;
  box-shadow:4px 5px 0 -2px var(--ground),4px 5px 0 0 var(--cream);animation:morph 4s ease-in-out infinite alternate;transition:transform .15s}
.addbtn svg{animation:spin 10s linear infinite}
.addbtn.ready svg,.addbtn:hover svg{animation-duration:1.4s}
.addbtn:active{transform:scale(.84) rotate(-8deg)}
.addbtn.burst{animation:burst .65s cubic-bezier(.2,1.6,.4,1)}
.addbtn.burst svg{animation:spin .65s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes burst{0%{transform:scale(.55)}55%{transform:scale(1.4) rotate(12deg)}100%{transform:scale(1)}}
.tagn.new{animation:plop .5s cubic-bezier(.2,1.5,.4,1)}
.tval{font-weight:800;font-size:44px;letter-spacing:-.04em;line-height:.9;text-transform:lowercase;font-variant-numeric:tabular-nums}
.sl{position:relative;height:72px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;border-radius:36px}
.sl:active{cursor:grabbing}
.sl-track{position:absolute;left:0;right:0;top:50%;height:18px;margin-top:-9px;border:2px solid var(--cream);border-radius:60px 40px 70px 30px / 30px 60px 40px 70px;overflow:hidden}
.sl-fill{height:100%;background:var(--cobalt);transform-origin:left center;transform:scaleX(.5)}
.sl-thumb{position:absolute;left:0;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;background:var(--pink);color:var(--ground);display:grid;place-items:center;
  border-radius:52% 48% 46% 54% / 60% 56% 44% 40%;box-shadow:4px 5px 0 -2px var(--ground),4px 5px 0 0 var(--cream);will-change:transform;animation:morph 3s ease-in-out infinite alternate}
.lens{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.len{border:1.5px solid var(--cream);padding:12px 10px 13px;text-align:left;font-weight:800;font-size:20px;letter-spacing:-.03em;text-transform:lowercase;line-height:1;border-radius:26px 32px 24px 34px / 30px 24px 34px 26px}
.len span{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.04em;margin-top:7px}
@property --l{syntax:"<length>";inherits:false;initial-value:0px}
@property --r{syntax:"<length>";inherits:false;initial-value:0px}
.lens{position:relative}
/* Camada creme recortada: a borda da frente corre, a de trás demora, e o preenchimento escorre de uma bolha à outra. */
.lens-top{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;pointer-events:none;background:var(--cream);color:var(--ground);
  clip-path:inset(0 var(--r) 0 var(--l) round 26px 32px 24px 34px / 30px 24px 34px 26px);transition:--r .42s cubic-bezier(.3,.8,.3,1),--l .72s cubic-bezier(.5,0,.2,1) .1s}
.lens-top.left{transition:--l .42s cubic-bezier(.3,.8,.3,1),--r .72s cubic-bezier(.5,0,.2,1) .1s}
.lens-top.noanim{transition:none}
.lens-top .len{display:block;border-color:transparent}
.sheet.fixed{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;font-size:19px;line-height:1.3}
.rules b{font-weight:800}
.rules .mono{display:block;margin-bottom:4px;color:var(--pink)}
.pill.hot{background:var(--pink);border-color:var(--pink);color:var(--ground)}
.curtain{position:fixed;inset:0;z-index:9;background:var(--ground);display:grid;place-items:center;overflow:hidden;animation:gone .45s var(--end) forwards}
@keyframes gone{to{opacity:0;visibility:hidden}}
.curtain .dot{position:absolute;left:50%;top:50%;width:96px;height:96px;border-radius:52% 48% 46% 54% / 60% 56% 44% 40%;animation:sway 1.1s ease-in-out infinite alternate}
.curtain .dot.c{background:var(--cobalt);margin:-48px 0 0 -150px}
.curtain .dot.p{background:var(--pink);margin:-48px 0 0 54px;animation-delay:-.55s}
@keyframes sway{from{transform:translateY(-20px) scale(.82) rotate(-10deg)}to{transform:translateY(20px) scale(1.18) rotate(10deg)}}
.curtain .dec{position:absolute;left:0;right:0;top:24%;text-align:center;color:var(--pink)}
.curtain .flood{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;border-radius:46% 54% 52% 48% / 54% 44% 56% 46%;transform:scale(0);animation:flood .9s var(--sus) cubic-bezier(.3,.8,.3,1) forwards}
.curtain.v .flood{background:var(--cobalt)}.curtain.m .flood{background:var(--pink)}
@keyframes flood{to{transform:scale(1) rotate(25deg)}}
.curtain .word{position:relative;font-weight:800;font-size:clamp(64px,22vw,112px);letter-spacing:-.05em;text-transform:lowercase;opacity:0;animation:wordin .35s calc(var(--sus) + .5s) cubic-bezier(.2,1.5,.4,1) forwards}
.curtain.m .word{color:var(--ground)}
@keyframes wordin{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.mode{font-size:clamp(19px,5.6vw,26px)}
.subs{display:flex;gap:8px}
.pill[aria-pressed="true"]{background:var(--cream);color:var(--ground)}
.pill[aria-pressed]{transition:background .3s,color .3s}
.chip.mesa{height:80px;padding:0 34px;font-size:30px;background:var(--pink);border-color:var(--pink);color:var(--ground)}
.chip.mesa.in{background:var(--cream);border-color:var(--cream)}
.chip.trai{background:var(--ground);color:var(--pink);border-color:var(--pink)}
.chip.trai::after{content:"*"}
.howbox{display:flex;flex-direction:column;gap:18px}
.how{list-style:none;margin:0;padding:0;counter-reset:h;display:flex;flex-direction:column;gap:16px}
.how li{counter-increment:h;display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:center;font-size:19px;line-height:1.28}
.how li::before{content:counter(h);width:58px;height:58px;display:grid;place-items:center;font-weight:800;font-size:30px;letter-spacing:-.04em;background:var(--pink);color:var(--ground);border-radius:52% 48% 46% 54% / 60% 56% 44% 40%;animation:morph 5s ease-in-out infinite alternate}
.how li:nth-child(2)::before{background:var(--cobalt);color:var(--cream);border-radius:46% 54% 52% 48% / 54% 44% 56% 46%;animation-delay:-2s}
.how li:nth-child(3)::before{background:var(--cream);border-radius:56% 44% 48% 52% / 50% 58% 42% 50%;animation-delay:-4s}
.how b{font-weight:800}
.howpts{border:1.5px dashed var(--cream);border-radius:28px 34px 26px 36px / 32px 26px 36px 28px;padding:14px 18px;font-size:16px;line-height:1.4}
.howpts i{font-style:normal;font-weight:800;color:var(--pink)}
.bub{align-self:center;width:210px;height:210px;display:grid;place-items:center}
.bub-b{position:relative;width:var(--s);height:var(--s);background:var(--pink);border-radius:52% 48% 46% 54% / 60% 56% 44% 40%;box-shadow:6px 7px 0 -2px var(--ground),6px 7px 0 0 var(--cream);
  transition:width .9s cubic-bezier(.2,1.7,.4,1),height .9s cubic-bezier(.2,1.7,.4,1);animation:morph 5s ease-in-out infinite alternate}
.bub:not([data-run="0"]) .bub-b{animation:morph 5s ease-in-out infinite alternate,shake .45s linear infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px) rotate(-1.5deg)}75%{transform:translate(2px,-1px) rotate(1.5deg)}}
.bub svg{position:absolute;inset:6%;width:88%;height:88%}
.bub path{fill:none;stroke:var(--ground);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .35s}
.bub[data-run="1"] .c1,.bub[data-run="2"] .c1,.bub[data-run="2"] .c2,.bub[data-run="3"] .c1,.bub[data-run="3"] .c2,.bub[data-run="3"] .c3,.bub[data-run="4"] path{opacity:1}
.pop{position:relative;height:150px;align-self:center;width:150px}
.pop span{position:absolute;left:50%;top:50%;margin:-16px 0 0 -16px;color:var(--pink);transform:rotate(var(--a)) translateY(-62px);animation:fly .7s var(--d) cubic-bezier(.2,1.5,.4,1) backwards}
.pop span:nth-child(even){color:var(--cobalt)}.pop span:nth-child(3n){color:var(--cream)}
@keyframes fly{from{transform:rotate(var(--a)) translateY(0) scale(0)}}
[hidden]{display:none!important}
.mode.wide{grid-column:1 / -1}
.mode[data-v="juri"] .ink{background:var(--cobalt)}
.mode[data-v="juri"][aria-pressed="true"]{border-color:var(--cobalt);color:var(--cream)}
.mode[data-v="troca"] .ink{background:var(--cream)}
.mode[data-v="troca"][aria-pressed="true"]{border-color:var(--cream);color:var(--ground)}
.bub{position:relative}
.bub .pop{display:none;position:absolute;left:50%;top:50%;margin:-75px 0 0 -75px}
.bub.burst .pop{display:block}
.bub.burst .bub-b{animation:popout .45s ease-out forwards}
@keyframes popout{50%{transform:scale(1.3)}100%{transform:scale(1.9);opacity:0}}
.bub.flat .bub-b{animation:none;transition:width 1.4s ease-in,height 1.4s ease-in}
.bub.flat path{opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* Cartas: [id, categoria, resposta (V/M), frente, verso]. Idioma: pt-BR. Para adicionar cartas, basta acrescentar linhas. */
const CARDS = [
["v01", "natureza", "V", `Tubarões existem há mais tempo do que os anéis de Saturno.`, `Tubarões surgiram há cerca de 450 milhões de anos. As estimativas mais citadas dão aos anéis de Saturno entre 100 e 400 milhões de anos, embora a idade deles ainda seja debatida.`, `Sharks have been around longer than Saturn's rings.`, `Sharks first appeared around 450 million years ago. The most-cited estimates put Saturn's rings at 100 to 400 million years old, though their age is still debated.`],
["v02", "espaço", "V", `Um dia em Vênus dura mais do que um ano venusiano.`, `Vênus leva 243 dias terrestres para girar em torno de si mesmo e só 225 para dar a volta no Sol.`, `A day on Venus lasts longer than a year on Venus.`, `Venus takes 243 Earth days to spin once on its axis, but only 225 to orbit the Sun.`],
["v03", "história", "V", `Cleópatra viveu mais perto da criação do iPhone do que da construção das Grandes Pirâmides.`, `A Grande Pirâmide ficou pronta por volta de 2560 a.C. Cleópatra morreu em 30 a.C., uns 2.500 anos depois, e o iPhone chegou em 2007, cerca de 2.040 anos depois dela.`, `Cleopatra lived closer in time to the invention of the iPhone than to the building of the Great Pyramids.`, `The Great Pyramid was finished around 2560 BC. Cleopatra died in 30 BC, about 2,500 years later, and the iPhone arrived in 2007, roughly 2,040 years after her.`],
["v04", "natureza", "V", `Flamingos nascem cinzentos ou brancos.`, `O rosa vem dos carotenoides das algas e crustáceos que eles comem. Sem essa dieta, a plumagem desbota.`, `Flamingos are born gray or white.`, `The pink comes from carotenoids in the algae and crustaceans they eat. Without that diet, their feathers fade.`],
["v05", "natureza", "V", `Existem mais árvores na Terra do que estrelas na Via Láctea.`, `Um estudo de 2015 estimou cerca de 3 trilhões de árvores. A Via Láctea tem entre 100 e 400 bilhões de estrelas.`, `There are more trees on Earth than stars in the Milky Way.`, `A 2015 study estimated around 3 trillion trees. The Milky Way has between 100 and 400 billion stars.`],
["v08", "corpo", "V", `Humanos compartilham cerca de 60% dos genes com bananas.`, `Cerca de 60% dos nossos genes têm um equivalente reconhecível na banana. Isso é diferente de dizer que 60% do DNA é idêntico.`, `Humans share about 60% of their genes with bananas.`, `About 60% of our genes have a recognizable counterpart in bananas. That's not the same as saying 60% of our DNA is identical.`],
["v09", "espaço", "V", `O Sol concentra mais de 99% da massa do Sistema Solar.`, `São 99,86%. Júpiter fica com a maior parte do que sobra.`, `The Sun holds more than 99% of the Solar System's mass.`, `It's 99.86%. Jupiter claims most of what's left.`],
["v10", "espaço", "V", `Saturno, teoricamente, flutuaria em uma piscina gigante de água.`, `A densidade média de Saturno é de 0,69 g/cm³, menor que a da água.`, `Saturn would theoretically float in a giant pool of water.`, `Saturn's average density is 0.69 g/cm³, lower than water's.`],
["v11", "natureza", "V", `Golfinhos possuem assobios característicos que funcionam como identificadores individuais.`, `Cada golfinho desenvolve um assobio-assinatura ainda filhote e reage quando ouve o próprio, como quem atende pelo nome.`, `Dolphins have signature whistles that work like individual names.`, `Each dolphin develops its own signature whistle as a calf and responds when it hears it, the same way we respond to our own name.`],
["v13", "corpo", "V", `O cérebro consome aproximadamente 20% da energia do corpo em repouso.`, `Ele representa só 2% do peso do corpo, mas gasta um quinto da energia.`, `The brain uses about 20% of the body's energy at rest.`, `It makes up only 2% of body weight but burns a fifth of the body's energy.`],
["v14", "ciência", "V", `O número de partidas possíveis de xadrez é maior do que o número de átomos no universo observável.`, `O matemático Claude Shannon estimou cerca de 10 elevado a 120 partidas. O universo observável tem algo como 10 elevado a 80 átomos.`, `There are more possible chess games than atoms in the observable universe.`, `Mathematician Claude Shannon estimated around 10 to the power of 120 possible games. The observable universe has something like 10 to the power of 80 atoms.`],
["v15", "ciência", "V", `Mel pode permanecer preservado por milhares de anos em condições adequadas.`, `Potes de mel encontrados em tumbas egípcias ainda estavam conservados. Pouca água e muita acidez impedem os micróbios de crescer.`, `Honey can stay preserved for thousands of years under the right conditions.`, `Jars of honey found in Egyptian tombs were still edible. Low water content and high acidity keep microbes from growing.`],
["v16", "natureza", "V", `Algumas tartarugas conseguem absorver oxigênio pela cloaca.`, `Certas espécies australianas e norte-americanas bombeiam água pela cloaca e retiram oxigênio dela, o que permite ficar meses submersas.`, `Some turtles can absorb oxygen through their cloaca.`, `Certain Australian and North American species pump water through their cloaca and extract oxygen from it, letting them stay underwater for months.`],
["v17", "ciência", "V", `Um raio pode atingir temperaturas superiores às da superfície do Sol.`, `O canal de um raio chega a cerca de 30.000 °C, cinco vezes a temperatura da superfície solar.`, `A lightning bolt can reach temperatures hotter than the surface of the Sun.`, `A lightning channel can reach about 30,000°C, five times hotter than the Sun's surface.`],
["v19", "espaço", "V", `Estrelas de nêutrons são tão densas que uma pequena quantidade de sua matéria pesaria bilhões de toneladas.`, `Uma colher de chá de estrela de nêutrons teria a massa de uma montanha: bilhões de toneladas.`, `Neutron stars are so dense that a tiny amount of their matter would weigh billions of tons.`, `A teaspoon of neutron star would have the mass of a mountain: billions of tons.`],
["v20", "ciência", "V", `A Torre Eiffel fica ligeiramente mais alta durante o verão.`, `O ferro se dilata com o calor e a torre pode ganhar até uns 15 cm nos dias mais quentes.`, `The Eiffel Tower gets slightly taller in summer.`, `Iron expands with heat, and the tower can gain up to about 15 cm on the hottest days.`],
["v21", "natureza", "V", `Cavalos conseguem dormir em pé.`, `Um sistema de tendões e ligamentos trava as pernas. Para o sono profundo, porém, eles precisam se deitar.`, `Horses can sleep standing up.`, `A system of tendons and ligaments locks their legs in place. For deep sleep, though, they still need to lie down.`],
["v22", "natureza", "V", `Uma espécie de água-viva consegue reverter seu ciclo de vida e voltar a uma fase juvenil.`, `A Turritopsis dohrnii, apelidada de água-viva imortal, volta ao estágio de pólipo quando sofre estresse ou ferimentos.`, `One species of jellyfish can reverse its life cycle and go back to a juvenile stage.`, `Turritopsis dohrnii, nicknamed the immortal jellyfish, reverts to its polyp stage when stressed or injured.`],
["v23", "natureza", "V", `Tubarões substituem seus dentes continuamente.`, `Os dentes ficam em fileiras que avançam como uma esteira. Um tubarão pode usar dezenas de milhares ao longo da vida.`, `Sharks continuously replace their teeth.`, `Their teeth sit in rows that move forward like a conveyor belt. A shark can go through tens of thousands over its lifetime.`],
["v24", "corpo", "V", `Humanos compartilham aproximadamente 99,9% do DNA entre si.`, `Toda a diversidade humana cabe em cerca de 0,1% do genoma.`, `Humans share about 99.9% of their DNA with each other.`, `All of human diversity fits into about 0.1% of the genome.`],
["v25", "espaço", "V", `Pegadas deixadas na Lua podem permanecer preservadas por milhões de anos.`, `Sem vento nem chuva, só a queda lenta de micrometeoritos consegue apagá-las.`, `Footprints left on the Moon could stay preserved for millions of years.`, `With no wind or rain, only the slow fall of micrometeorites can erase them.`],
["v26", "ciência", "V", `Uma substância produzida por castores já foi utilizada como aromatizante com cheiro semelhante à baunilha.`, `É o castóreo, secreção de glândulas próximas à cauda. Foi usado em perfumes e aromas de baunilha e framboesa; hoje é raríssimo na indústria.`, `A substance produced by beavers has been used as a flavoring with a smell similar to vanilla.`, `It's castoreum, a secretion from glands near the tail. It was used in perfumes and in vanilla and raspberry flavorings; today it's extremely rare in the industry.`],
["v27", "natureza", "V", `Machos de algumas espécies de peixe-pescador abissal se fundem fisicamente ao corpo das fêmeas.`, `O macho morde a fêmea, os tecidos se unem e ele passa a viver do sangue dela, servindo como fornecedor permanente de esperma.`, `Males of some deep-sea anglerfish species physically fuse to the female's body.`, `The male bites the female, their tissues merge, and he starts living off her blood, becoming a permanent sperm supplier.`],
["v28", "natureza", "V", `Fêmeas de hienas-malhadas possuem um pseudopênis e dão à luz através dele.`, `É um clitóris alongado, pelo qual elas urinam, copulam e parem. O primeiro parto costuma ser arriscado para mãe e filhote.`, `Female spotted hyenas have a pseudo-penis and give birth through it.`, `It's an elongated clitoris, which they use to urinate, mate, and give birth. The first birth is usually risky for both mother and cub.`],
["v29", "natureza", "V", `O braço reprodutor de um argonauta pode se desprender e permanecer dentro da fêmea.`, `O braço carregado de esperma se solta do macho e fica na fêmea. O naturalista Cuvier chegou a descrevê-lo como um verme parasita.`, `An argonaut's mating arm can break off and stay inside the female.`, `The sperm-filled arm detaches from the male and remains inside the female. Naturalist Cuvier even described it as a parasitic worm.`],
["v30", "natureza", "V", `Fêmeas de canguru possuem três vaginas.`, `Duas laterais conduzem o esperma e a central serve para o parto. Os machos têm um pênis bifurcado.`, `Female kangaroos have three vaginas.`, `Two side ones carry sperm, and the middle one is for giving birth. Males have a forked penis.`],
["v31", "história", "V", `Na Grécia Antiga, já existia uma máquina automática que liberava água após a inserção de uma moeda.`, `O engenheiro grego Heron de Alexandria descreveu, no século 1, um aparelho de templo: o peso da moeda acionava uma alavanca que liberava água benta.`, `Ancient Greece already had a vending machine that dispensed water when you dropped in a coin.`, `Greek engineer Heron of Alexandria described a temple device in the 1st century: the weight of the coin triggered a lever that released holy water.`],
["v32", "história", "V", `O imperador romano Vespasiano criou um imposto sobre a coleta de urina.`, `A urina era matéria-prima para curtumes e lavanderias. Da história vem a frase "dinheiro não tem cheiro".`, `Roman emperor Vespasian created a tax on collecting urine.`, `Urine was a raw material for tanneries and laundries. That's where we get the phrase "money doesn't stink."`],
["v33", "história", "V", `A guilhotina foi utilizada pela última vez na França em 1977.`, `A última execução foi em setembro de 1977, em Marselha. A pena de morte francesa só acabou em 1981.`, `The guillotine was last used in France in 1977.`, `The last execution took place in September 1977, in Marseille. France didn't abolish the death penalty until 1981.`],
["v34", "história", "V", `A Universidade de Oxford é mais antiga que o Império Asteca.`, `Já havia ensino em Oxford por volta de 1096. Tenochtitlán, a capital asteca, foi fundada em 1325.`, `Oxford University is older than the Aztec Empire.`, `Teaching was already happening at Oxford around 1096. Tenochtitlan, the Aztec capital, wasn't founded until 1325.`],
["v35", "história", "V", `A Guerra Anglo-Zanzibar durou menos de uma hora.`, `Em 27 de agosto de 1896, o conflito durou entre 38 e 45 minutos. É a guerra mais curta já registrada.`, `The Anglo-Zanzibar War lasted less than an hour.`, `On August 27, 1896, the conflict lasted between 38 and 45 minutes. It's the shortest war ever recorded.`],
["v36", "ciência", "V", `O concreto romano possui propriedades que permitem reparar fissuras.`, `Pedaços de cal na mistura reagem com a água que entra nas rachaduras e formam novos cristais que as fecham, segundo um estudo do MIT de 2023.`, `Roman concrete has properties that let it repair its own cracks.`, `Chunks of lime in the mix react with water that seeps into cracks, forming new crystals that seal them, according to a 2023 MIT study.`],
["v37", "natureza", "V", `Cangurus conseguem pausar o desenvolvimento de um embrião até que as condições sejam favoráveis.`, `O fenômeno se chama diapausa embrionária. O embrião fica em espera enquanto há outro filhote na bolsa ou falta comida.`, `Kangaroos can pause an embryo's development until conditions are favorable.`, `The phenomenon is called embryonic diapause. The embryo stays on hold while there's already a joey in the pouch or food is scarce.`],
["v38", "história", "V", `As Olimpíadas já tiveram competições de pintura, escultura, arquitetura e literatura.`, `Entre 1912 e 1948, obras inspiradas no esporte disputavam medalhas olímpicas.`, `The Olympics once had competitions in painting, sculpture, architecture, and literature.`, `Between 1912 and 1948, works inspired by sport competed for Olympic medals.`],
["v39", "história", "V", `Em 1814, uma onda gigante de cerveja invadiu as ruas de Londres e matou oito pessoas.`, `Um tonel gigante de uma cervejaria se rompeu e derrubou outros. Centenas de milhares de litros inundaram um bairro pobre vizinho.`, `In 1814, a giant wave of beer flooded the streets of London and killed eight people.`, `A giant vat at a brewery burst and knocked over others. Hundreds of thousands of liters flooded a poor neighborhood nearby.`],
["v40", "história", "V", `Em 1752, os britânicos foram dormir no dia 2 de setembro e acordaram no dia 14.`, `O Reino Unido trocou o calendário juliano pelo gregoriano e precisou pular 11 dias de uma vez.`, `In 1752, the British went to sleep on September 2nd and woke up on the 14th.`, `The UK switched from the Julian to the Gregorian calendar and had to skip 11 days all at once.`],
["v41", "história", "V", `Um atleta ganhou a maratona olímpica de 1904 após receber estricnina, clara de ovo e conhaque durante a corrida.`, `Thomas Hicks recebeu a mistura dos treinadores como estimulante, em St. Louis. Cruzou a linha carregado e desabou em seguida.`, `An athlete won the 1904 Olympic marathon after being given strychnine, egg whites, and brandy during the race.`, `Thomas Hicks got the mix from his trainers as a stimulant, in St. Louis. He crossed the finish line being carried and collapsed right after.`],
["v42", "tecnologia", "V", `A primeira webcam foi criada para monitorar uma cafeteira em uma universidade.`, `Em 1991, pesquisadores de Cambridge apontaram uma câmera para a cafeteira do laboratório para não fazer a viagem à toa.`, `The first webcam was created to keep an eye on a coffee pot at a university.`, `In 1991, researchers at Cambridge pointed a camera at the lab's coffee pot so they wouldn't make the trip for nothing.`],
["v43", "natureza", "V", `O Lago Baikal, na Rússia, contém aproximadamente 20% da água doce líquida não congelada do planeta.`, `É o lago mais profundo do mundo, com 1.642 metros, e guarda mais água que os cinco Grandes Lagos da América do Norte juntos.`, `Lake Baikal, in Russia, holds about 20% of the planet's unfrozen liquid fresh water.`, `It's the world's deepest lake, at 1,642 meters, and holds more water than all five Great Lakes of North America combined.`],
["v44", "espaço", "V", `A distância média entre a Terra e a Lua é suficiente para colocar aproximadamente 30 Terras lado a lado.`, `São 384.400 km de distância média, e a Terra tem cerca de 12.742 km de diâmetro.`, `The average distance between Earth and the Moon is enough to fit about 30 Earths side by side.`, `It's an average distance of 384,400 km, and Earth is about 12,742 km in diameter.`],
["v45", "história", "V", `Pierre de Coubertin, fundador dos Jogos Olímpicos modernos, ganhou uma medalha olímpica de literatura.`, `Em 1912, ele levou o ouro com o poema "Ode ao Esporte", inscrito sob pseudônimo.`, `Pierre de Coubertin, founder of the modern Olympic Games, won an Olympic medal in literature.`, `In 1912, he took gold with the poem "Ode to Sport," entered under a pseudonym.`],
["v46", "história", "V", `Um homem abandonou uma maratona olímpica, pegou carona de carro e ainda cruzou a linha de chegada em primeiro lugar.`, `Fred Lorz, em 1904, percorreu boa parte do trajeto de carro e correu o trecho final. Quase recebeu a medalha antes de ser desmascarado.`, `A man dropped out of an Olympic marathon, hitched a car ride, and still crossed the finish line in first place.`, `Fred Lorz, in 1904, covered much of the course by car and ran only the final stretch. He nearly received the medal before being exposed.`],
["v47", "tecnologia", "V", `A palavra "bug" já era usada na engenharia antes de ficar famosa por causa de um inseto encontrado em um computador.`, `Thomas Edison já escrevia sobre "bugs" em seus inventos em 1878. A mariposa presa no computador de Harvard é de 1947.`, `The word "bug" was already used in engineering before it became famous because of an actual insect found in a computer.`, `Thomas Edison was already writing about "bugs" in his inventions in 1878. The moth trapped in the Harvard computer dates to 1947.`],
["v48", "história", "V", `Em 1919, uma onda de melaço invadiu as ruas de Boston, destruiu edifícios e matou 21 pessoas.`, `Um tanque com milhões de litros se rompeu. A onda tinha vários metros de altura e avançou a dezenas de quilômetros por hora.`, `In 1919, a wave of molasses flooded the streets of Boston, destroyed buildings, and killed 21 people.`, `A tank holding millions of liters burst open. The wave stood several meters tall and surged forward at dozens of kilometers per hour.`],
["v49", "história", "V", `Em 1932, o Exército australiano mobilizou soldados e metralhadoras para combater uma população de emas. E perdeu.`, `Cerca de 20 mil emas devastavam plantações no oeste do país. As aves se dispersavam rápido demais e a operação foi encerrada sem sucesso.`, `In 1932, the Australian Army mobilized soldiers and machine guns to fight a population of emus. And lost.`, `About 20,000 emus were ravaging crops in the west of the country. The birds scattered too fast, and the operation was called off without success.`],
["v50", "história", "V", `Em 1518, centenas de pessoas em uma cidade europeia começaram a dançar compulsivamente durante dias, sem conseguir parar.`, `Aconteceu em Estrasburgo. Começou com uma mulher e chegou a até 400 pessoas. A causa nunca foi esclarecida.`, `In 1518, hundreds of people in a European city began dancing compulsively for days, unable to stop.`, `It happened in Strasbourg. It started with one woman and grew to as many as 400 people. The cause was never explained.`],
["v51", "história", "V", `Um homem sobreviveu à explosão da bomba atômica em Hiroshima e, três dias depois, também sobreviveu à explosão em Nagasaki.`, `Tsutomu Yamaguchi estava em Hiroshima a trabalho, voltou ferido para casa, em Nagasaki, e viveu até 2010, aos 93 anos.`, `A man survived the atomic bomb explosion in Hiroshima and, three days later, also survived the explosion in Nagasaki.`, `Tsutomu Yamaguchi was in Hiroshima on business, returned injured to his home in Nagasaki, and lived until 2010, at age 93.`],
["v52", "história", "V", `Em 897, um papa ordenou que o cadáver de seu antecessor fosse desenterrado, vestido com roupas papais e levado a julgamento.`, `No Sínodo do Cadáver, o papa Estêvão VI julgou o corpo de Formoso. O morto foi condenado e jogado no rio Tibre.`, `In 897, a pope ordered his predecessor's corpse dug up, dressed in papal robes, and put on trial.`, `At the Cadaver Synod, Pope Stephen VI put the body of Pope Formosus on trial. The corpse was found guilty and thrown into the Tiber River.`],
["v53", "história", "V", `A palavra "quarentena" surgiu durante a pandemia de peste negra no século 14, como referência aos 40 dias de isolamento de navios e viajantes.`, `Vem do veneziano "quaranta giorni". Portos como Ragusa e Veneza isolavam navios antes de permitir o desembarque.`, `The word "quarantine" emerged during the Black Death pandemic in the 14th century, referring to the 40 days ships and travelers were isolated.`, `It comes from the Venetian "quaranta giorni," meaning forty days. Ports like Ragusa and Venice isolated ships before allowing anyone to disembark.`],

["m01", "tecnologia", "M", `A NASA gastou milhões de dólares para desenvolver uma caneta capaz de escrever no espaço, enquanto os astronautas soviéticos usavam lápis.`, `A caneta espacial foi criada por uma empresa privada, com dinheiro próprio. A NASA comprou as canetas por poucos dólares cada, e os soviéticos também compraram.`, `NASA spent millions of dollars developing a pen that could write in space, while Soviet astronauts just used pencils.`, `The space pen was created by a private company, with its own money. NASA bought the pens for a few dollars each, and the Soviets bought them too.`],
["m02", "história", "M", `Na Idade Média, a maioria dos europeus acreditava que a Terra era plana.`, `A Terra esférica era consenso entre os letrados desde os gregos. O mito da Idade Média terraplanista se espalhou no século 19.`, `In the Middle Ages, most Europeans believed the Earth was flat.`, `A spherical Earth had been accepted by scholars since the ancient Greeks. The myth of a flat-Earth Middle Ages spread in the 19th century.`],
["m03", "história", "M", `Os soldados romanos recebiam parte do pagamento em sal, de onde surgiu a palavra "salário".`, `Não há registro de legionários pagos em sal. A palavra "salarium" tem relação com sal, mas a explicação exata dessa origem é incerta.`, `Roman soldiers were partly paid in salt, which is where the word "salary" comes from.`, `There's no record of legionaries being paid in salt. The word "salarium" is linked to salt, but the exact origin of that connection is uncertain.`],
["m04", "tecnologia", "M", `O primeiro computador pessoal da história foi inventado pela IBM.`, `O IBM PC é de 1981. Antes dele vieram o Kenbak-1 (1971), o Altair 8800 (1975) e o Apple II (1977).`, `The first personal computer in history was invented by IBM.`, `The IBM PC dates to 1981. Before it came the Kenbak-1 (1971), the Altair 8800 (1975), and the Apple II (1977).`],
["m05", "ciência", "M", `Um centavo jogado do topo do Empire State Building pode matar uma pessoa na calçada.`, `A moeda é leve e achatada, e a resistência do ar limita a velocidade dela. No máximo, daria um susto e uma ardida.`, `A penny dropped from the top of the Empire State Building can kill someone on the sidewalk below.`, `The coin is light and flat, and air resistance caps its speed. At most, it would give you a scare and a sting.`],
["m06", "natureza", "M", `Os touros ficam agressivos quando enxergam a cor vermelha.`, `Touros não distinguem o vermelho. O que os provoca é o movimento da capa.`, `Bulls get aggressive when they see the color red.`, `Bulls can't actually tell red apart from other colors. What provokes them is the movement of the cape.`],
["m07", "história", "M", `Os antigos romanos construíam salas especiais chamadas vomitoriums para que as pessoas pudessem vomitar durante os banquetes e continuar comendo.`, `Vomitório era o corredor por onde a multidão saía de estádios e teatros. O nome vem de "despejar" gente.`, `The ancient Romans built special rooms called vomitoriums where people could throw up during banquets and keep eating.`, `A vomitorium was the passageway crowds used to exit stadiums and theaters. The name comes from "to spew out" people.`],
["m08", "história", "M", `Napoleão Bonaparte tinha menos de 1,55 m de altura.`, `Ele media perto de 1,68 m, na média da época. A fama veio da confusão entre medidas francesas e inglesas e das caricaturas britânicas.`, `Napoleon Bonaparte stood under 5 feet 1 inch tall.`, `He actually stood close to 5 feet 6 inches, about average for his era. The myth came from a mix-up between French and English units, plus British caricatures.`],
["m09", "espaço", "M", `A Grande Muralha da China pode ser vista facilmente a olho nu da Lua.`, `Da Lua não se distingue nenhuma construção humana. Mesmo da órbita baixa, a muralha é muito difícil de ver.`, `The Great Wall of China can easily be seen with the naked eye from the Moon.`, `No human structure can be made out from the Moon. Even from low orbit, the wall is very hard to see.`],
["m10", "história", "M", `A expressão "OK" surgiu durante a Guerra Civil Americana, como abreviação de "0 killed".`, `"OK" apareceu em 1839, num jornal de Boston, como piada com a grafia errada "oll korrect". A Guerra Civil só começou em 1861.`, `The expression "OK" originated during the American Civil War, as an abbreviation for "0 killed."`, `"OK" first appeared in 1839, in a Boston newspaper, as a joke using the misspelling "oll korrect." The Civil War didn't start until 1861.`],
["m11", "natureza", "M", `Peixes dourados têm uma memória de apenas três segundos.`, `Eles lembram de coisas por meses e podem ser treinados para cumprir tarefas e reconhecer horários de alimentação.`, `Goldfish have a memory span of only three seconds.`, `They remember things for months and can be trained to perform tasks and recognize feeding times.`],
["m12", "ciência", "M", `Um raio nunca cai duas vezes no mesmo lugar.`, `O Empire State Building é atingido cerca de 20 vezes por ano.`, `Lightning never strikes the same place twice.`, `The Empire State Building gets struck about 20 times a year.`],
["m13", "história", "M", `Albert Einstein foi reprovado em matemática quando era criança.`, `Ele sempre foi excelente em matemática e dominava cálculo aos 15 anos.`, `Albert Einstein failed math as a child.`, `He was always excellent at math and had mastered calculus by age 15.`],
["m14", "história", "M", `Os vikings usavam capacetes com chifres durante as batalhas.`, `Nenhum capacete viking com chifres foi encontrado. A imagem vem de pinturas e figurinos de ópera do século 19.`, `Vikings wore horned helmets into battle.`, `No horned Viking helmet has ever been found. The image comes from 19th-century paintings and opera costumes.`],
["m15", "corpo", "M", `Raspar os pelos faz com que eles cresçam mais grossos e escuros.`, `A lâmina corta o pelo na parte mais larga, e a ponta reta parece mais grossa. Estudos desde 1928 mostram que nada muda.`, `Shaving makes hair grow back thicker and darker.`, `The blade cuts hair at its widest point, so the blunt tip just looks thicker. Studies since 1928 show nothing actually changes.`],
["m16", "natureza", "M", `Morcegos são completamente cegos e dependem exclusivamente da ecolocalização para encontrar o caminho.`, `Todos os morcegos enxergam. Muitas espécies frugívoras têm ótima visão e nem usam ecolocalização.`, `Bats are completely blind and rely solely on echolocation to find their way.`, `All bats can see. Many fruit-eating species have excellent vision and don't even use echolocation.`],
["m17", "corpo", "M", `A língua humana possui regiões específicas para sentir cada sabor: doce na ponta, amargo no fundo e azedo nas laterais.`, `O "mapa da língua" nasceu da má interpretação de um estudo alemão de 1901. Todas as regiões com papilas sentem todos os sabores.`, `The human tongue has specific zones for each taste: sweet at the tip, bitter at the back, and sour on the sides.`, `The "tongue map" came from a misread German study from 1901. Every area with taste buds can sense every flavor.`],
["m18", "natureza", "M", `Avestruzes enterram a cabeça na areia quando sentem medo.`, `Elas correm ou se deitam com o pescoço rente ao chão. Também baixam a cabeça para virar os ovos no ninho, que é um buraco no solo.`, `Ostriches bury their heads in the sand when they're scared.`, `They either run off or lie flat with their neck against the ground. They also lower their heads to turn the eggs in the nest, which is just a hole in the ground.`],
["m19", "história", "M", `O famoso incêndio de Chicago, em 1871, começou quando uma vaca derrubou uma lamparina em um estábulo.`, `Um repórter admitiu anos depois que inventou a história da vaca. A causa do incêndio nunca foi determinada.`, `The famous Chicago fire of 1871 started when a cow knocked over a lantern in a barn.`, `A reporter admitted years later that he made up the cow story. The actual cause of the fire was never determined.`],
["m20", "cultura", "M", `A palavra "sushi" significa peixe cru em japonês.`, `Sushi se refere ao arroz temperado com vinagre. Peixe cru fatiado é sashimi.`, `The word "sushi" means raw fish in Japanese.`, `"Sushi" actually refers to vinegared rice. Sliced raw fish is sashimi.`],
["m21", "história", "M", `Na Idade Média, as pessoas tomavam banho apenas uma vez por ano, porque acreditavam que a água transmitia doenças.`, `Casas de banho públicas eram comuns nas cidades medievais. O medo da água veio depois, a partir do século 16.`, `In the Middle Ages, people bathed only once a year because they believed water spread disease.`, `Public bathhouses were common in medieval towns. The fear of water came later, starting in the 16th century.`],
["m22", "história", "M", `Nenhuma pessoa condenada nos julgamentos das bruxas de Salem foi executada por enforcamento.`, `Dezenove condenados foram enforcados e um homem morreu esmagado por pedras. O mito é a fogueira: ninguém foi queimado em Salem.`, `None of the people condemned in the Salem witch trials were executed by hanging.`, `Nineteen convicted people were hanged, and one man was crushed to death with stones. The myth is the bonfire: no one was burned at Salem.`],
["m23", "tecnologia", "M", `Thomas Edison inventou sozinho a primeira lâmpada elétrica funcional.`, `Outros inventores, como Humphry Davy e Joseph Swan, já tinham lâmpadas funcionando. Edison e sua equipe criaram, em 1879, uma versão durável e comercialmente viável.`, `Thomas Edison single-handedly invented the first working electric light bulb.`, `Other inventors, like Humphry Davy and Joseph Swan, already had working bulbs. In 1879, Edison and his team created a durable, commercially viable version.`],
["m24", "espaço", "M", `O primeiro ser vivo enviado ao espaço foi um macaco.`, `Foram moscas-das-frutas, lançadas pelos Estados Unidos em 1946. O primeiro macaco subiu em 1949, e a cadela Laika orbitou a Terra em 1957.`, `The first living creature sent into space was a monkey.`, `It was fruit flies, launched by the United States in 1946. The first monkey went up in 1949, and the dog Laika orbited the Earth in 1957.`],
["m25", "corpo", "M", `Apenas 10% do cérebro humano está em funcionamento durante as atividades cotidianas.`, `Exames de imagem mostram atividade em praticamente todo o cérebro ao longo de um dia, até durante o sono.`, `Only 10% of the human brain is active during everyday tasks.`, `Brain scans show activity across nearly the entire brain throughout the day, even during sleep.`],
["m26", "história", "M", `O navegador Cristóvão Colombo foi o primeiro europeu a chegar às Américas.`, `O viking Leif Erikson chegou à Terra Nova, no atual Canadá, por volta do ano 1000, quase cinco séculos antes.`, `The navigator Christopher Columbus was the first European to reach the Americas.`, `The Viking Leif Erikson reached Newfoundland, in present-day Canada, around the year 1000 — almost five centuries earlier.`],
["m27", "espaço", "M", `Os astronautas da Apollo 11 foram os primeiros seres humanos a observar a Terra inteira de uma só vez.`, `Foi a tripulação da Apollo 8, em dezembro de 1968, a primeira a se afastar o bastante para ver o planeta inteiro.`, `The Apollo 11 astronauts were the first humans to see the whole Earth at once.`, `It was the Apollo 8 crew, in December 1968, who were the first to travel far enough to see the entire planet.`],
["m28", "história", "M", `Os antigos egípcios utilizavam camelos para transportar os blocos usados na construção das pirâmides.`, `Camelos só se tornaram comuns no Egito muitos séculos depois. Os blocos iam em trenós sobre areia molhada e em barcos pelo Nilo.`, `The ancient Egyptians used camels to haul the blocks used to build the pyramids.`, `Camels didn't become common in Egypt until many centuries later. The blocks were moved on sledges over wet sand and by boat along the Nile.`],
["m29", "história", "M", `A Grande Muralha da China é uma construção única e contínua, que atravessa o país de ponta a ponta.`, `É um conjunto de muralhas erguidas por dinastias diferentes, com trechos paralelos, lacunas e barreiras naturais no meio.`, `The Great Wall of China is a single, continuous structure running from one end of the country to the other.`, `It's actually a collection of walls built by different dynasties, with parallel sections, gaps, and natural barriers in between.`],
["m30", "história", "M", `O famoso explorador Marco Polo foi o primeiro europeu a chegar à China.`, `O pai e o tio dele já tinham estado na corte de Kublai Khan anos antes, e fontes chinesas registram enviados romanos no século 2.`, `The famous explorer Marco Polo was the first European to reach China.`, `His father and uncle had already visited Kublai Khan's court years earlier, and Chinese sources record Roman envoys as far back as the 2nd century.`],
["m31", "história", "M", `Os antigos gregos esculpiam suas estátuas em mármore branco porque consideravam essa a cor mais bonita para representar seus deuses.`, `As estátuas eram pintadas com cores vivas. A tinta se perdeu com o tempo, e o ideal do mármore branco veio séculos depois.`, `The ancient Greeks carved their statues from white marble because they considered it the most beautiful color to represent their gods.`, `The statues were actually painted in bright colors. The paint faded over time, and the ideal of white marble came centuries later.`],
["m32", "natureza", "M", `O Monte Everest é a montanha mais alta do planeta quando medido desde a base até o topo.`, `Da base ao topo, ganha o Mauna Kea, no Havaí, com mais de 10 mil metros, a maior parte debaixo d'água. O Everest é o mais alto em relação ao nível do mar.`, `Mount Everest is the tallest mountain on the planet when measured from base to peak.`, `Measured base to peak, Mauna Kea in Hawaii wins, at over 10,000 meters, most of it underwater. Everest is only the highest relative to sea level.`],
["m34", "história", "M", `O inventor da guilhotina foi condenado à morte e executado pelo próprio aparelho que criou.`, `Joseph-Ignace Guillotin apenas propôs o método, projetado por outro médico, e morreu de causas naturais em 1814.`, `The inventor of the guillotine was sentenced to death and executed by the very device he created.`, `Joseph-Ignace Guillotin only proposed the method, which was designed by another physician, and he died of natural causes in 1814.`],
["m35", "história", "M", `O Império Romano caiu em um único dia, quando Roma foi invadida pelos povos bárbaros.`, `A queda do lado ocidental levou gerações, com saques em 410 e 455 e o último imperador deposto em 476. O lado oriental durou até 1453.`, `The Roman Empire fell in a single day, when Rome was invaded by barbarian tribes.`, `The fall of the western half took generations, with sacks in 410 and 455 and the last emperor deposed in 476. The eastern half lasted until 1453.`],
["m36", "história", "M", `O imperador Nero tocava violino enquanto Roma pegava fogo.`, `O violino só surgiu uns 1.500 anos depois. Segundo o historiador Tácito, Nero estava fora de Roma e voltou para organizar o socorro.`, `Emperor Nero played the violin while Rome burned.`, `The violin wasn't invented until about 1,500 years later. According to the historian Tacitus, Nero was away from Rome and returned to organize relief efforts.`],
["m37", "história", "M", `A Biblioteca de Alexandria foi destruída completamente em uma única noite, quando Júlio César incendiou a cidade.`, `O incêndio de 48 a.C. atingiu parte do acervo, mas a biblioteca seguiu funcionando e definhou ao longo de séculos, por falta de verba e conflitos.`, `The Library of Alexandria was completely destroyed in a single night, when Julius Caesar set the city on fire.`, `The 48 BC fire damaged part of the collection, but the library kept operating and declined over centuries from lack of funding and conflict.`],
["m38", "história", "M", `Os vikings bebiam cerveja em copos feitos de crânios de seus inimigos.`, `O mito nasceu de um erro de tradução no século 17: um poema falava em chifres de animais usados como copos.`, `Vikings drank beer out of cups made from their enemies' skulls.`, `The myth came from a mistranslation in the 17th century: a poem actually referred to animal horns used as drinking cups.`],
["m39", "ciência", "M", `Albert Einstein ganhou o Prêmio Nobel de Física por desenvolver a teoria da relatividade.`, `O Nobel de 1921 foi pela explicação do efeito fotoelétrico. A relatividade ainda era considerada polêmica demais.`, `Albert Einstein won the Nobel Prize in Physics for developing the theory of relativity.`, `The 1921 Nobel was for his explanation of the photoelectric effect. Relativity was still considered too controversial.`],
["m40", "história", "M", `Os cintos de castidade eram objetos comuns usados por mulheres medievais para impedir relações sexuais enquanto seus maridos viajavam.`, `Não há evidência confiável de uso na Idade Média. A maioria das peças em museus foi fabricada nos séculos 18 e 19.`, `Chastity belts were common items worn by medieval women to prevent sex while their husbands traveled.`, `There's no reliable evidence they were used in the Middle Ages. Most of the pieces found in museums were actually made in the 18th and 19th centuries.`],
["m41", "corpo", "M", `Engolir um chiclete faz com que ele permaneça no estômago durante sete anos.`, `A goma não é digerida, mas atravessa o sistema digestivo e sai em poucos dias, como qualquer outra coisa.`, `Swallowing gum makes it stay in your stomach for seven years.`, `Gum isn't digested, but it passes through your digestive system and comes out within days, like anything else you eat.`],
["m42", "corpo", "M", `Comer cenoura melhora a visão noturna e permite enxergar melhor no escuro.`, `O mito foi espalhado pela propaganda britânica na Segunda Guerra para esconder o uso do radar. A vitamina A só ajuda quem tem carência dela.`, `Eating carrots improves night vision and lets you see better in the dark.`, `The myth was spread by British propaganda in World War II to hide the use of radar. Vitamin A only helps people who are actually deficient in it.`],
["m43", "corpo", "M", `Sair de casa com o cabelo molhado em um dia frio pode fazer você pegar um resfriado.`, `Resfriado é causado por vírus. Sem contato com um deles, cabelo molhado só dá frio.`, `Going outside with wet hair on a cold day can give you a cold.`, `A cold is caused by a virus. Without exposure to one, wet hair just makes you feel cold.`],
["m44", "corpo", "M", `Beber álcool ajuda a aquecer o corpo quando está muito frio.`, `O álcool dilata os vasos da pele e dá sensação de calor, mas faz o corpo perder temperatura mais rápido.`, `Drinking alcohol helps warm up your body when it's very cold out.`, `Alcohol dilates the blood vessels in your skin, creating a feeling of warmth, but it actually makes your body lose heat faster.`],
["m45", "corpo", "M", `Estalar os dedos com frequência provoca artrite nas articulações.`, `O estalo é gás se movendo no líquido da articulação. Um médico estalou os dedos de uma só mão por mais de 60 anos e não achou diferença entre as duas.`, `Cracking your knuckles often causes arthritis in the joints.`, `That popping sound is just gas moving in the joint fluid. One doctor cracked the knuckles on only one hand for over 60 years and found no difference between the two.`],
["m46", "corpo", "M", `Comer muito açúcar deixa as crianças hiperativas.`, `Estudos controlados não encontram diferença de comportamento. O que muda é a expectativa dos pais, e o ambiente de festa faz o resto.`, `Eating too much sugar makes children hyperactive.`, `Controlled studies find no difference in behavior. What changes is parents' expectations, and the excitement of a party does the rest.`],
["m47", "corpo", "M", `É possível engolir a própria língua durante uma convulsão.`, `A língua está presa ao assoalho da boca. O certo é deitar a pessoa de lado e nunca colocar nada na boca dela.`, `It's possible to swallow your own tongue during a seizure.`, `The tongue is attached to the floor of the mouth. The right move is to lay the person on their side and never put anything in their mouth.`],
["m48", "natureza", "M", `Uma pessoa engole, em média, oito aranhas por ano enquanto dorme.`, `Não existe nenhum registro disso. Para uma aranha, uma pessoa dormindo é um animal enorme que respira e vibra, algo a evitar.`, `On average, a person swallows eight spiders a year while sleeping.`, `There's no record of this ever happening. To a spider, a sleeping person is a huge animal that breathes and vibrates — something to avoid.`],
["m49", "natureza", "M", `Se você tocar em um filhote de passarinho, a mãe vai abandoná-lo por causa do cheiro humano.`, `A maioria das aves tem olfato fraco e não abandona a cria por causa de cheiro. Ainda assim, o melhor é mexer o mínimo possível.`, `If you touch a baby bird, its mother will abandon it because of the human scent.`, `Most birds have a weak sense of smell and won't abandon their young over a scent. Still, it's best to handle them as little as possible.`],
["m50", "corpo", "M", `Ler no escuro ou com pouca iluminação pode estragar permanentemente a visão.`, `A pouca luz cansa os olhos e pode dar dor de cabeça, mas o efeito passa com descanso.`, `Reading in the dark or in low light can permanently damage your eyesight.`, `Dim light strains your eyes and can cause headaches, but the effect wears off with rest.`],
["v54", "história", "V", `Em 1989, a Pepsi recebeu da União Soviética 17 submarinos e três navios de guerra como pagamento por refrigerante.`, `Sem moeda forte para pagar, os soviéticos entregaram navios velhos. A Pepsi revendeu tudo como sucata.`, `In 1989, Pepsi received 17 submarines and three warships from the Soviet Union as payment for soda.`, `With no hard currency to pay, the Soviets handed over old ships instead. Pepsi resold all of it as scrap.`],
["v55", "história", "V", `A Nintendo foi fundada antes do fim do Império Otomano.`, `A Nintendo nasceu em 1889, fabricando cartas de baralho. O Império Otomano só acabou em 1922.`, `Nintendo was founded before the Ottoman Empire came to an end.`, `Nintendo was founded in 1889, making playing cards. The Ottoman Empire didn't end until 1922.`],
["v56", "tecnologia", "V", `O fax foi inventado antes do telefone.`, `A primeira patente de um aparelho de fax é de 1843. O telefone só foi patenteado em 1876.`, `The fax machine was invented before the telephone.`, `The first fax machine patent dates to 1843. The telephone wasn't patented until 1876.`],
["v57", "tecnologia", "V", `O isqueiro foi inventado antes do fósforo.`, `Um isqueiro químico, a lâmpada de Döbereiner, é de 1823. O fósforo de fricção apareceu em 1826.`, `The lighter was invented before the match.`, `A chemical lighter, the Döbereiner lamp, dates to 1823. The friction match appeared in 1826.`],
["v58", "história", "V", `Ainda existiam mamutes vivos quando a Grande Pirâmide de Gizé ficou pronta.`, `Uma população isolada sobreviveu numa ilha do Ártico até cerca de 2000 a.C. A pirâmide é de cerca de 2560 a.C.`, `Woolly mammoths were still alive when the Great Pyramid of Giza was completed.`, `An isolated population survived on an Arctic island until about 2000 BC. The pyramid dates to around 2560 BC.`],
["v59", "história", "V", `Anne Frank e Martin Luther King nasceram no mesmo ano.`, `Os dois nasceram em 1929. Ela morreu em 1945, e ele ficou conhecido nos anos 1950 e 1960.`, `Anne Frank and Martin Luther King Jr. were born in the same year.`, `Both were born in 1929. She died in 1945, while he rose to fame in the 1950s and 60s.`],
["v60", "história", "V", `Em 2007, o exército da Suíça invadiu Liechtenstein por engano.`, `Cerca de 170 soldados se perderam à noite num treino e cruzaram a fronteira. A Suíça pediu desculpas, e Liechtenstein disse que não havia problema.`, `In 2007, the Swiss army accidentally invaded Liechtenstein.`, `About 170 soldiers got lost at night during a training exercise and crossed the border. Switzerland apologized, and Liechtenstein said it was no big deal.`],
["v61", "esporte", "V", `Em 1923, um jóquei venceu uma corrida de cavalos depois de morto.`, `Frank Hayes sofreu um infarto no meio da prova, em Nova York, e o cavalo cruzou a linha em primeiro com ele ainda na sela.`, `In 1923, a jockey won a horse race after dying mid-race.`, `Frank Hayes had a heart attack partway through the race in New York, and the horse crossed the finish line first with him still in the saddle.`],
["v62", "história", "V", `A Austrália batizou uma piscina pública com o nome de um primeiro-ministro que desapareceu nadando no mar.`, `Harold Holt sumiu numa praia em 1967 e nunca foi encontrado. Um centro aquático em Melbourne leva o nome dele.`, `Australia named a public pool after a prime minister who vanished while swimming in the sea.`, `Harold Holt disappeared at a beach in 1967 and was never found. A swimming center in Melbourne is named after him.`],
["v63", "história", "V", `Em 1961, um bombardeiro americano deixou cair duas bombas de hidrogênio sobre a Carolina do Norte.`, `O avião se partiu no ar. As bombas não explodiram, mas numa delas quase todos os mecanismos de segurança falharam.`, `In 1961, an American bomber dropped two hydrogen bombs over North Carolina.`, `The plane broke apart in midair. The bombs didn't explode, but on one of them, nearly every safety mechanism failed.`],
["v64", "história", "V", `Em 1983, o sistema de alerta soviético acusou um ataque nuclear dos Estados Unidos. O oficial de plantão achou que era erro, não repassou o aviso, e estava certo.`, `Stanislav Petrov desconfiou porque o sistema mostrava poucos mísseis. Era o reflexo do sol nas nuvens confundindo um satélite.`, `In 1983, the Soviet warning system flagged a US nuclear attack. The officer on duty figured it was a glitch, didn't pass on the alert, and he was right.`, `Stanislav Petrov grew suspicious because the system showed too few missiles. It was sunlight reflecting off clouds confusing a satellite.`],
["v65", "história", "V", `Nos anos 1960, a CIA implantou um microfone em um gato para espionar soviéticos.`, `O projeto se chamava Acoustic Kitty e custou milhões. Foi abandonado porque o gato não ia para onde mandavam.`, `In the 1960s, the CIA implanted a microphone in a cat to spy on the Soviets.`, `The project was called Acoustic Kitty and cost millions. It was scrapped because the cat wouldn't go where it was told.`],
["v66", "espaço", "V", `Os Estados Unidos tiveram um plano para detonar uma bomba nuclear na Lua.`, `O Projeto A119, de 1958, queria um clarão visível da Terra para impressionar os soviéticos. Foi cancelado.`, `The United States had a plan to detonate a nuclear bomb on the Moon.`, `Project A119, from 1958, aimed for a flash visible from Earth to impress the Soviets. It was scrapped.`],
["v67", "história", "V", `Um soldado japonês continuou lutando a Segunda Guerra até 1974.`, `Hiroo Onoda ficou escondido na selva das Filipinas, sem acreditar que a guerra tinha acabado. Só se rendeu quando o antigo comandante foi buscá-lo.`, `One Japanese soldier kept fighting World War II until 1974.`, `Hiroo Onoda stayed hidden in the jungles of the Philippines, refusing to believe the war was over. He only surrendered when his old commander came to get him.`],
["v68", "bar", "V", `Durante a Lei Seca, o governo americano envenenou álcool de propósito, e milhares de pessoas morreram.`, `O álcool industrial era desviado para fazer bebida. O governo mandou acrescentar substâncias tóxicas para desencorajar o consumo.`, `During Prohibition, the US government deliberately poisoned alcohol, and thousands of people died.`, `Industrial alcohol was being diverted to make liquor. The government had toxic substances added to it to discourage drinking.`],
["v69", "história", "V", `Stálin foi indicado duas vezes ao Prêmio Nobel da Paz.`, `As indicações são de 1945 e 1948, pelo papel dele no fim da Segunda Guerra. Não ganhou.`, `Stalin was nominated twice for the Nobel Peace Prize.`, `The nominations came in 1945 and 1948, for his role in ending World War II. He didn't win.`],
["v70", "história", "V", `Catorze anos antes do Titanic, um romance descreveu um transatlântico chamado Titan afundando ao bater em um iceberg.`, `O livro é de 1898. O navio da ficção também era considerado inafundável e também tinha poucos botes.`, `Fourteen years before the Titanic, a novel described an ocean liner called the Titan sinking after hitting an iceberg.`, `The book came out in 1898. The fictional ship was also considered unsinkable, and it also carried too few lifeboats.`],
["v71", "história", "V", `Uma mesma mulher estava a bordo do Titanic, do navio-irmão que afundou e do outro navio-irmão que sofreu uma colisão. Sobreviveu aos três.`, `Violet Jessop era camareira e enfermeira. Passou pelo Olympic em 1911, pelo Titanic em 1912 e pelo Britannic em 1916.`, `One woman was aboard the Titanic, its sister ship that sank, and the other sister ship that survived a collision. She lived through all three.`, `Violet Jessop was a stewardess and nurse. She was on the Olympic in 1911, the Titanic in 1912, and the Britannic in 1916.`],
["v72", "bar", "V", `Canadá e Dinamarca disputaram uma ilha por décadas deixando garrafas de bebida um para o outro.`, `Na ilha Hans, cada lado fincava sua bandeira e deixava uma garrafa de uísque ou de aguardente. Em 2022, dividiram a ilha ao meio.`, `Canada and Denmark feuded over an island for decades by leaving each other bottles of liquor.`, `On Hans Island, each side would plant its flag and leave a bottle of whisky or schnapps. In 2022, they split the island in half.`],
["v73", "esporte", "V", `Em 1969, El Salvador e Honduras entraram em guerra depois de jogos das eliminatórias da Copa.`, `A tensão entre os países já era antiga, e os jogos foram o estopim. A Guerra do Futebol durou cerca de 100 horas.`, `In 1969, El Salvador and Honduras went to war after World Cup qualifying matches.`, `Tensions between the countries ran deep already, and the matches were the spark. The Football War lasted about 100 hours.`],
["v74", "história", "V", `Na Europa medieval, porcos e ratos foram julgados em tribunal, com direito a advogado.`, `Há registros de porcos condenados e executados por matar crianças, e de ratos intimados por destruir plantações.`, `In medieval Europe, pigs and rats were put on trial in court, with a right to a lawyer.`, `There are records of pigs convicted and executed for killing children, and of rats summoned for destroying crops.`],
["v75", "história", "V", `Antes do despertador, havia gente paga para bater na janela dos outros e acordá-los.`, `Na Inglaterra industrial, esses profissionais usavam varas compridas ou zarabatanas com ervilhas secas.`, `Before the alarm clock, people were paid to knock on others' windows to wake them up.`, `In industrial England, these professionals used long poles or blowpipes loaded with dried peas.`],
["v76", "tabu", "V", `Na Inglaterra, maridos vendiam as esposas em leilão público até o século 19.`, `Como o divórcio era caro demais, a venda servia como separação informal. Muitas vezes o comprador já estava combinado.`, `In England, husbands auctioned off their wives in public until the 19th century.`, `Since divorce was too expensive, the sale served as an informal separation. The buyer was often arranged in advance.`],
["v77", "história", "V", `Napoleão já foi atacado por uma multidão de coelhos e teve de recuar.`, `Para uma caçada em 1807, soltaram centenas de coelhos criados em cativeiro. Em vez de fugir, eles correram para cima dele atrás de comida.`, `Napoleon was once attacked by a mob of rabbits and had to retreat.`, `For a 1807 hunt, hundreds of captive-bred rabbits were released. Instead of fleeing, they charged at him looking for food.`],
["v78", "ciência", "V", `Cerca de 1 em cada 200 homens no mundo carrega uma linhagem masculina atribuída a Gêngis Khan.`, `Um estudo genético de 2003 encontrou o mesmo cromossomo Y em milhões de homens da Ásia; pesquisas mais recentes sugerem que o número real de descendentes pode ser menor do que se pensava.`, `About 1 in every 200 men in the world carries a male lineage traced to Genghis Khan.`, `A 2003 genetic study linked this estimate to a lineage common across Asia; more recent research suggests the real number of descendants may be much smaller.`],
["v79", "cultura", "V", `O jogo Banco Imobiliário nasceu como crítica ao capitalismo.`, `A americana Lizzie Magie criou o jogo em 1904 para mostrar como os donos de terras enriquecem às custas dos inquilinos.`, `Monopoly was created as a critique of capitalism.`, `American Lizzie Magie invented the game in 1904 to show how landlords get rich at tenants' expense.`],
["v80", "natureza", "V", `Uma galinha viveu 18 meses sem cabeça.`, `Em 1945, nos Estados Unidos, o corte poupou a base do cérebro. O dono alimentava a ave com um conta-gotas e a exibia em feiras.`, `A chicken lived for 18 months without a head.`, `In 1945, in the United States, the cut spared the base of the brain. The owner fed the bird with an eyedropper and put it on display at fairs.`],
["v81", "tabu", "V", `A heroína foi vendida pela Bayer como xarope para tosse.`, `A partir de 1898, era anunciada como alternativa à morfina que não viciava, inclusive para crianças.`, `Heroin was sold by Bayer as a cough syrup.`, `Starting in 1898, it was marketed as a non-addictive alternative to morphine, even for children.`],
["v82", "bar", "V", `O ketchup já foi vendido como remédio.`, `Na década de 1830, um médico americano vendia pílulas de tomate contra indigestão e diarreia.`, `Ketchup was once sold as medicine.`, `In the 1830s, an American doctor sold tomato pills for indigestion and diarrhea.`],
["v83", "tabu", "V", `O Viagra foi descoberto por acaso, em testes de um remédio para o coração.`, `O remédio não funcionou bem para a dor no peito, mas os voluntários relataram um efeito colateral inesperado.`, `Viagra was discovered by accident, during trials for a heart medication.`, `The drug didn't work well for chest pain, but volunteers reported an unexpected side effect.`],

["v139", "história", "V", `Na Roma Antiga já existiam lanchonetes de rua, com balcões de comida quente pronta.`, `Só em Pompeia foram encontradas cerca de 150. Muita gente não tinha cozinha em casa.`, `Ancient Rome already had street fast-food counters serving hot meals.`, `Pompeii alone had about 150 of them. Many people had no kitchen at home.`],

["v141", "história", "V", `O corpo de Charlie Chaplin foi roubado do túmulo, e os ladrões pediram resgate à viúva.`, `Aconteceu na Suíça, em 1978. A viúva se recusou a pagar, e o caixão foi recuperado semanas depois.`, `Charlie Chaplin's body was stolen from his grave, and the thieves demanded a ransom from his widow.`, `It happened in Switzerland in 1978. His widow refused to pay, and the coffin was recovered weeks later.`],
["v142", "ciência", "V", `Isaac Newton enfiou uma agulha grossa atrás do próprio olho para estudar como enxergamos as cores.`, `Ele anotou a experiência em detalhe: ao pressionar o olho por trás, via círculos coloridos.`, `Isaac Newton stuck a thick needle behind his own eye to study how we see color.`, `He recorded the experiment in detail: pressing on the back of his eye made him see colored circles.`],
